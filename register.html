<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your Work2U account</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23A78BFA'/%3E%3Cstop offset='0.5' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%23EC4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M30 35 L50 25 L70 35 L70 65 L50 75 L30 65 Z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M42 50 L48 56 L60 44' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #0a0a14;
    --bg-2: #15151f;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --ink: rgba(255,255,255,0.9);
    --ink-2: rgba(255,255,255,0.6);
    --ink-3: rgba(255,255,255,0.4);
    --purple: #a78bfa;
    --purple-2: #8b5cf6;
    --pink: #ec4899;
    --green: #10b981;
    --red: #ef4444;
    --shadow: 0 10px 40px rgba(167, 139, 250, 0.15);
  }
  
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }
  
  body::before {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 60%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: -1;
    animation: pulse 10s ease-in-out infinite alternate;
  }
  
  @keyframes pulse {
    0% { opacity: 0.4; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0.8; transform: translate(-50%,-50%) scale(1.2); }
  }
  
  .orbs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.4;
  }
  
  .orb-1 {
    top: 10%; right: -100px;
    width: 350px; height: 350px;
    background: var(--purple);
    animation: float 18s ease-in-out infinite;
  }
  
  .orb-2 {
    bottom: -100px; left: -100px;
    width: 350px; height: 350px;
    background: var(--pink);
    animation: float 22s ease-in-out infinite reverse;
  }
  
  @keyframes float {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(50px, 50px); }
  }
  
  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(20, 20, 30, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    box-shadow: var(--shadow);
  }
  
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  
  .brand-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    display: grid;
    place-items: center;
    font-size: 24px;
    font-weight: 700;
    color: white;
    transform: perspective(400px) rotateY(-15deg);
    box-shadow: 0 8px 24px rgba(167,139,250,0.4);
  }
  
  .brand-name {
    font-size: 22px;
    font-weight: 500;
    color: white;
    letter-spacing: -0.01em;
  }
  
  .heading { text-align: center; margin-bottom: 8px; }
  .heading h1 { font-size: 28px; font-weight: 600; color: white; margin-bottom: 8px; letter-spacing: -0.02em; }
  .heading p { color: var(--ink-2); font-size: 14px; }
  
  .form { margin-top: 28px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  
  .form-group { margin-bottom: 16px; }
  
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--ink);
  }
  
  .form-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
  }
  
  .form-input:focus {
    outline: none;
    border-color: var(--purple);
    background: rgba(167, 139, 250, 0.06);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
  }
  
  .form-input::placeholder { color: var(--ink-3); }
  
  .form-hint {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 4px;
  }
  
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(167, 139, 250, 0.25);
    margin-top: 8px;
  }
  
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(167, 139, 250, 0.4);
  }
  
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  
  .btn-google {
    background: white;
    color: #1f1f1f;
    border: 1px solid #dadce0;
    padding: 12px;
  }
  
  .btn-google:hover { background: #f8f9fa; }
  .btn-google svg { width: 18px; height: 18px; }
  
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--ink-3);
    font-size: 12px;
  }
  
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  
  .links {
    text-align: center;
    margin-top: 20px;
    color: var(--ink-2);
    font-size: 14px;
  }
  
  .links a {
    color: var(--purple);
    text-decoration: none;
    font-weight: 500;
  }
  
  .links a:hover { text-decoration: underline; }
  
  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  
  .alert-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }
  
  .alert-success {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #6ee7b7;
  }
  
  .alert-show { display: block; }
  
  .footer-text {
    text-align: center;
    margin-top: 20px;
    color: var(--ink-3);
    font-size: 12px;
    line-height: 1.6;
  }
  
  .footer-text a { color: var(--purple); text-decoration: none; }
  .footer-text a:hover { text-decoration: underline; }
  
  @media (max-width: 480px) {
    .card { padding: 28px 24px; }
    .heading h1 { font-size: 24px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="card">
  <div class="brand">
    <div class="brand-icon">W</div>
    <span class="brand-name">Work2U</span>
  </div>
  
  <div class="heading">
    <h1>Get started free</h1>
    <p>Create your CRM workspace in 30 seconds</p>
  </div>
  
  <div class="alert alert-error" id="alert-error"></div>
  <div class="alert alert-success" id="alert-success"></div>
  
  <form class="form" id="register-form" novalidate>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="firstName">First name</label>
        <input type="text" id="firstName" name="firstName" class="form-input" placeholder="Ali" required autocomplete="given-name">
      </div>
      <div class="form-group">
        <label class="form-label" for="lastName">Last name</label>
        <input type="text" id="lastName" name="lastName" class="form-input" placeholder="Ahmad" required autocomplete="family-name">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label" for="company">Company / Workspace name</label>
      <input type="text" id="company" name="company" class="form-input" placeholder="e.g. Saga X Ventures" required autocomplete="organization">
    </div>
    
    <div class="form-group">
      <label class="form-label" for="email">Work email</label>
      <input type="email" id="email" name="email" class="form-input" placeholder="you@company.com" required autocomplete="email">
    </div>
    
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-input" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
      <div class="form-hint">Must be at least 8 characters long</div>
    </div>
    
    <button type="submit" class="btn btn-primary" id="submit-btn">
      <span id="submit-text">Create account</span>
    </button>
  </form>
  
  <div class="divider">or</div>
  
  <button class="btn btn-google" id="google-btn">
    <svg viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    <span>Sign up with Google</span>
  </button>
  
  <div class="links">
    Already have an account? <a href="/login">Sign in</a>
  </div>
  
  <p class="footer-text">
    By continuing, you agree to our<br>
    <a href="/terms-of-service">Terms of Service</a> and <a href="/privacy-policy">Privacy Policy</a>
  </p>
</div>

<script>
const errorEl = document.getElementById('alert-error');
const successEl = document.getElementById('alert-success');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('alert-show');
  successEl.classList.remove('alert-show');
  setTimeout(() => errorEl.classList.remove('alert-show'), 6000);
}

function showSuccess(msg) {
  successEl.textContent = msg;
  successEl.classList.add('alert-show');
  errorEl.classList.remove('alert-show');
}

// Check if already signed in
fetch('/api/auth/session', { credentials: 'include' })
  .then(r => r.json())
  .then(data => {
    if (data.authenticated) {
      window.location.href = '/dashboard';
    }
  })
  .catch(() => {});

// Email/Password registration
document.getElementById('register-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const company = document.getElementById('company').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const submitBtn = document.getElementById('submit-btn');
  const submitText = document.getElementById('submit-text');
  
  if (!firstName || !lastName || !company || !email || !password) {
    showError('Please fill in all fields');
    return;
  }
  
  if (password.length < 8) {
    showError('Password must be at least 8 characters');
    return;
  }
  
  if (!email.includes('@') || !email.includes('.')) {
    showError('Please enter a valid email');
    return;
  }
  
  submitBtn.disabled = true;
  submitText.textContent = 'Creating account...';
  
  try {
    const response = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ firstName, lastName, company, email, password })
    });
    
    const data = await response.json();
    
    if (!response.ok) {
      showError(data.error || 'Failed to create account');
      submitBtn.disabled = false;
      submitText.textContent = 'Create account';
      return;
    }
    
    showSuccess('Account created! Welcome to Work2U...');
    setTimeout(() => {
      window.location.href = '/dashboard';
    }, 1000);
    
  } catch (err) {
    showError('Network error. Please try again.');
    submitBtn.disabled = false;
    submitText.textContent = 'Create account';
  }
});

// Google OAuth
document.getElementById('google-btn').addEventListener('click', function() {
  window.location.href = '/api/auth/google/login';
});
</script>

</body>
</html>
