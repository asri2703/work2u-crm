/* ==========================================================================
   Registry-driven boards (monday.com style)
   One registry describes each pipeline object; one set of generic renderers
   draws it. This replaced the separate renderTasks/renderKanban and
   renderLeads/renderPipeline, so tasks and leads now share the same board,
   status pills, drag-and-drop, and inline stage menu. Adding another pipeline
   object is a registry entry, not new render code.
   ========================================================================== */

/* monday.com's actual status palette — kept literal so the look is familiar. */
var OBJECTS = {
  tasks: {
    label: 'Tasks',
    sub: 'Track work across stages',
    itemLabel: 'Task',
    addLabel: '+ New Task',
    stages: [
      { id: 'todo', label: 'To Do', color: '#579bfc' },
      { id: 'progress', label: 'In Progress', color: '#fdab3d' },
      { id: 'review', label: 'Review', color: '#a25ddc' },
      { id: 'done', label: 'Done', color: '#00c875' }
    ],
    columns: [
      { key: 'priority', label: 'Priority', type: 'priority' },
      { key: 'tag', label: 'Tag', type: 'tag' },
      { key: 'due', label: 'Due', type: 'date' }
    ]
  },
  leads: {
    label: 'Leads',
    sub: 'Prospects not yet converted',
    itemLabel: 'Lead',
    addLabel: '+ New Lead',
    stages: [
      { id: 'new', label: 'New', color: '#579bfc' },
      { id: 'contacted', label: 'Contacted', color: '#00d2d2' },
      { id: 'qualified', label: 'Qualified', color: '#fdab3d' },
      { id: 'converted', label: 'Converted', color: '#00c875' }
    ],
    columns: [
      { key: 'company', label: 'Company', type: 'text' },
      { key: 'value', label: 'Value', type: 'money' }
    ]
  }
};

var BOARD_MODE_KEY = 'work2u-board-mode';

function getBoardMode(key) {
  // Default to the Board (kanban) view — cards in horizontal columns — and
  // only show the Table view when the user has explicitly chosen it.
  try {
    var store = JSON.parse(localStorage.getItem(BOARD_MODE_KEY) || '{}');
    return store[key] === 'table' ? 'table' : 'kanban';
  } catch (e) { return 'kanban'; }
}
function setBoardMode(key, mode) {
  var store = {};
  try { store = JSON.parse(localStorage.getItem(BOARD_MODE_KEY) || '{}'); } catch (e) {}
  store[key] = mode;
  localStorage.setItem(BOARD_MODE_KEY, JSON.stringify(store));
  renderObjectBoard(key);
  document.querySelectorAll('.board-toggle-btn').forEach(function (b) {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
}

function stageOf(key, id) {
  var obj = OBJECTS[key];
  for (var i = 0; i < obj.stages.length; i++) if (obj.stages[i].id === id) return obj.stages[i];
  return null;
}

/* Page shell for a pipeline object: header, view toggle, and the board slot. */
function renderObjectView(key) {
  var obj = OBJECTS[key];
  var mode = getBoardMode(key);
  var main = document.getElementById('main');
  main.innerHTML =
    '<div class="page-header">' +
      '<div><h1 class="page-title">' + esc(obj.label) + '</h1><div class="page-sub">' + esc(obj.sub) + '</div></div>' +
      '<div class="board-head-actions">' +
        '<div class="board-toggle" role="tablist" aria-label="View">' +
          '<button class="board-toggle-btn ' + (mode === 'kanban' ? 'active' : '') + '" data-mode="kanban" onclick="setBoardMode(\'' + key + '\',\'kanban\')">Board</button>' +
          '<button class="board-toggle-btn ' + (mode === 'table' ? 'active' : '') + '" data-mode="table" onclick="setBoardMode(\'' + key + '\',\'table\')">Table</button>' +
        '</div>' +
        '<button class="btn btn-primary" onclick="openAdd()">' + esc(obj.addLabel) + '</button>' +
      '</div>' +
    '</div>' +
    '<div id="object-board"></div>';
  renderObjectBoard(key);
}

function renderObjectBoard(key) {
  var host = document.getElementById('object-board');
  if (!host) return;
  if (getBoardMode(key) === 'kanban') renderObjectKanban(key, host);
  else renderMondayTable(key, host);
}

/* Group items by stage, preserving stage order and catching any orphan status. */
function groupByStage(key) {
  var obj = OBJECTS[key];
  var groups = {};
  obj.stages.forEach(function (s) { groups[s.id] = []; });
  (D[key] || []).forEach(function (item) {
    if (!groups[item.status]) groups[item.status] = [];  // orphan status still shows
    groups[item.status].push(item);
  });
  return groups;
}

/* ---- monday.com-style grouped table ---------------------------------- */
function renderMondayTable(key, host) {
  var obj = OBJECTS[key];
  var groups = groupByStage(key);
  var html = '';
  obj.stages.forEach(function (stage) {
    var rows = groups[stage.id] || [];
    html +=
      '<section class="mb-group" data-stage="' + stage.id + '">' +
        '<div class="mb-group-head" style="--stage:' + stage.color + '">' +
          '<span class="mb-group-name">' + esc(stage.label) + '</span>' +
          '<span class="mb-group-count">' + rows.length + '</span>' +
        '</div>' +
        '<div class="mb-rows" data-stage="' + stage.id + '">' +
          (rows.length ? rows.map(function (item) { return mbRow(key, item); }).join('') :
            '<div class="mb-empty">Drop ' + esc(obj.itemLabel.toLowerCase()) + 's here</div>') +
        '</div>' +
      '</section>';
  });
  host.className = 'monday-board';
  host.innerHTML = html;
  wireBoardDnD(key, host, '.mb-rows');
}

function mbRow(key, item) {
  var obj = OBJECTS[key];
  var st = stageOf(key, item.status) || { label: item.status || '—', color: '#c4c4c4' };
  var cells = obj.columns.map(function (col) {
    return '<div class="mb-cell mb-cell-' + col.type + '">' + renderCell(col, item) + '</div>';
  }).join('');
  return '' +
    '<div class="mb-row" draggable="true" data-id="' + esc(String(item.id)) + '" onclick="editItem(\'' + key + '\',\'' + esc(String(item.id)) + '\')">' +
      '<span class="mb-drag" aria-hidden="true">⋮⋮</span>' +
      '<div class="mb-name">' + esc(item.name || 'Untitled') + '</div>' +
      '<button type="button" class="status-pill" style="background:' + st.color + '" ' +
        'onclick="event.stopPropagation(); openStageMenu(\'' + key + '\',\'' + esc(String(item.id)) + '\', this)">' +
        esc(st.label) + ' <span class="status-caret">▾</span></button>' +
      cells +
    '</div>';
}

function renderCell(col, item) {
  var v = item[col.key];
  if (col.type === 'money') { var n = parseFloat(item.value) || 0; return n > 0 ? '<span class="mb-money">RM ' + n.toLocaleString() + '</span>' : '<span class="mb-dim">—</span>'; }
  if (col.type === 'priority') { var p = v || 'med'; return '<span class="mb-prio mb-prio-' + esc(p) + '">' + esc(p) + '</span>'; }
  if (col.type === 'tag') { return v ? '<span class="mb-tag ' + esc(v) + '">' + esc(v) + '</span>' : '<span class="mb-dim">—</span>'; }
  if (col.type === 'date') { return v ? '<span class="mb-date">' + esc(v) + '</span>' : '<span class="mb-dim">—</span>'; }
  return v ? esc(String(v)) : '<span class="mb-dim">—</span>';
}

/* ---- kanban view (registry-driven) ----------------------------------- */
function renderObjectKanban(key, host) {
  var obj = OBJECTS[key];
  var groups = groupByStage(key);
  host.className = 'kanban';
  host.innerHTML = obj.stages.map(function (stage) {
    var rows = groups[stage.id] || [];
    return '' +
      '<div class="kanban-col" data-stage="' + stage.id + '">' +
        '<div class="kanban-col-header"><div class="col-title">' +
          '<span class="col-dot" style="background:' + stage.color + '"></span>' + esc(stage.label) +
        '</div><span class="col-count">' + rows.length + '</span></div>' +
        '<div class="kanban-body" data-stage="' + stage.id + '">' +
          (rows.length ? rows.map(function (item) { return kanbanCard(key, item); }).join('') :
            '<div class="kanban-empty">Drop ' + esc(obj.itemLabel.toLowerCase()) + 's here</div>') +
        '</div>' +
      '</div>';
  }).join('');
  wireBoardDnD(key, host, '.kanban-body');
}

function kanbanCard(key, item) {
  var obj = OBJECTS[key];
  var st = stageOf(key, item.status) || { label: item.status, color: '#c4c4c4' };
  var meta;
  if (key === 'leads') {
    var val = parseFloat(item.value) || 0;
    meta = '<span class="mb-dim">' + esc(item.company || '') + '</span>' + (val > 0 ? '<span class="mb-money">RM ' + val.toLocaleString() + '</span>' : '');
  } else {
    meta = '<span class="mb-prio mb-prio-' + esc(item.priority || 'med') + '">' + esc(item.priority || 'med') + '</span>' +
           (item.tag ? '<span class="mb-tag ' + esc(item.tag) + '">' + esc(item.tag) + '</span>' : '');
  }
  return '' +
    '<div class="item-card" draggable="true" data-id="' + esc(String(item.id)) + '" onclick="editItem(\'' + key + '\',\'' + esc(String(item.id)) + '\')">' +
      '<div class="item-card-title">' + esc(item.name || 'Untitled') + '</div>' +
      '<div class="item-card-meta">' + meta + '</div>' +
    '</div>';
}

/* ---- shared drag-and-drop -------------------------------------------- */
/* Works for both the table rows and the kanban cards. Cards carry data-id;
 * each drop zone carries data-stage. Handlers are assigned (not added) so a
 * re-render never stacks duplicates. */
function wireBoardDnD(key, host, zoneSelector) {
  host.querySelectorAll('[draggable="true"][data-id]').forEach(function (card) {
    card.addEventListener('dragstart', function (e) {
      var id = card.dataset.id;
      if (!id) { e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
      document.body.classList.add('board-dragging');
    });
    card.addEventListener('dragend', function () {
      card.classList.remove('dragging');
      document.body.classList.remove('board-dragging');
    });
  });
  host.querySelectorAll(zoneSelector).forEach(function (zone) {
    var stage = zone.dataset.stage;
    zone.ondragover = function (e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; zone.classList.add('zone-over'); };
    zone.ondragleave = function (e) { if (!zone.contains(e.relatedTarget)) zone.classList.remove('zone-over'); };
    zone.ondrop = function (e) {
      e.preventDefault();
      zone.classList.remove('zone-over');
      var id = e.dataTransfer.getData('text/plain');
      if (id) changeStage(key, id, stage);
    };
  });
}

/* The one mutation both drag-drop and the status menu call. */
function changeStage(key, id, status) {
  var item = (D[key] || []).find(function (x) { return String(x.id) === String(id); });
  if (!item || item.status === status) return false;
  item.status = status;
  saveKey(key);
  renderObjectBoard(key);
  var st = stageOf(key, status);
  if (typeof notify === 'function') notify(OBJECTS[key].itemLabel + ' → ' + (st ? st.label : status));
  return true;
}

/* ---- inline colored status menu (monday.com signature) --------------- */
function closeStageMenu() {
  var m = document.getElementById('stage-menu');
  if (m) m.remove();
}
function openStageMenu(key, id, anchor) {
  closeStageMenu();
  var obj = OBJECTS[key];
  var menu = document.createElement('div');
  menu.className = 'stage-menu';
  menu.id = 'stage-menu';
  obj.stages.forEach(function (s) {
    var opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'stage-menu-item';
    opt.innerHTML = '<span class="stage-swatch" style="background:' + s.color + '"></span>' + esc(s.label);
    opt.onclick = function (ev) { ev.stopPropagation(); changeStage(key, id, s.id); closeStageMenu(); };
    menu.appendChild(opt);
  });
  document.body.appendChild(menu);
  var r = anchor.getBoundingClientRect();
  menu.style.top = (window.scrollY + r.bottom + 4) + 'px';
  menu.style.left = (window.scrollX + r.left) + 'px';
  // Close on the next outside click (deferred so this click doesn't trigger it).

function isoDateLocal(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function calendarWeekStart(date) {
  const start = new Date(date);
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() - start.getDay());
  return start;
}

function calendarEventMatchesFilter(ev, typeFilter) {
  const filter = String(typeFilter || 'all').toLowerCase();
  if (filter === 'all') return true;
  return String(ev && ev.type ? ev.type : '').toLowerCase() === filter;
}

function calendarChannelMatchesFilter(ev, channelFilter) {
  const filter = String(channelFilter || 'all').toLowerCase();
  if (filter === 'all') return true;
  return String(ev && ev.channel ? ev.channel : '').toLowerCase() === filter;
}

function buildCalendarDayItems(dateString, events) {
  const items = [];
  D.tasks.forEach(function(t) {
    if (t.due === dateString) {
      items.push({ text: t.name || 'Task', kind: 'task' });
    }
  });
  D.leads.forEach(function(l) {
    if (l.followup === dateString) {
      items.push({ text: '📞 ' + (l.name || 'Lead'), kind: 'lead' });
    }
  });
  (Array.isArray(events) ? events : []).forEach(function(ev) {
    if (ev && ev.date === dateString) {
      items.push({
        text: (ev.channel ? '[' + ev.channel + '] ' : '') + (ev.title || 'Event'),
        kind: 'calendar',
        id: ev.id,
        type: ev.type,
        channel: ev.channel || ''
      });
    }
  });
  return items;
}

function summarizeCalendarDayItems(items) {
  const list = Array.isArray(items) ? items : [];
  const counts = { task: 0, lead: 0, calendar: 0 };
  const channels = [];
  list.forEach(function(item) {
    if (item.kind === 'task') counts.task += 1;
    else if (item.kind === 'lead') counts.lead += 1;
    else if (item.kind === 'calendar') {
      counts.calendar += 1;
      if (item.channel) channels.push(item.channel);
    }
  });
  const parts = [list.length + ' item' + (list.length === 1 ? '' : 's')];
  if (counts.task) parts.push(counts.task + ' task' + (counts.task === 1 ? '' : 's'));
  if (counts.lead) parts.push(counts.lead + ' lead' + (counts.lead === 1 ? '' : 's'));
  if (counts.calendar) parts.push(counts.calendar + ' event' + (counts.calendar === 1 ? '' : 's'));
  if (channels.length) parts.push(Array.from(new Set(channels)).slice(0, 2).join(' / '));
  return parts.join(' • ');
}

function saveCalendarEvent() {
  const existing = editId ? D.calendarEvents.find(function(event) { return event.id === editId; }) : null;
  const item = normalizeCalendarEvent({
    id: editId || '',
    title: getV('f-title'),
    date: getV('f-date'),
    type: getV('f-type'),
    channel: getV('f-channel'),
    source: getV('f-source') || 'manual',
    notes: getV('f-notes'),
    createdAt: existing && existing.createdAt ? existing.createdAt : new Date().toISOString()
  }, D.calendarEvents.length);
  if (editId) {
    const i = D.calendarEvents.findIndex(function(event) { return event.id === editId; });
    if (i !== -1) D.calendarEvents[i] = Object.assign({}, D.calendarEvents[i], item);

  saveKey('calendarEvents');
  editId = null;
  closeModal();

function deleteCalendarEvent() {

}

function renderCalendar(c) {
  const now = new Date();
  const todayIso = isoDateLocal(now);
  const y = now.getFullYear();
  const m = now.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const calendarEvents = Array.isArray(D.calendarEvents) ? D.calendarEvents : [];
  const viewMode = getCalendarViewMode();
  const typeFilter = getCalendarTypeFilter();
  const channelFilter = getCalendarChannelFilter();
  const availableChannels = Array.from(new Set(calendarEvents.map(function(ev) {
    return ev && ev.channel ? String(ev.channel).trim() : '';
  }).filter(Boolean)));
  const filteredCalendarEvents = calendarEvents.filter(function(ev) {
    return ev && ev.date && calendarEventMatchesFilter(ev, typeFilter) && calendarChannelMatchesFilter(ev, channelFilter);
  });
  const rangeDates = [];

  if (viewMode === 'week') {
    const start = calendarWeekStart(now);
    for (let i = 0; i < 7; i++) {
      const date = new Date(start);
      date.setDate(start.getDate() + i);
      rangeDates.push({
        iso: isoDateLocal(date),
        day: date.getDate(),
        weekday: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()],
        month: months[date.getMonth()],
        today: isoDateLocal(date) === todayIso
      });
    }
  } else {
    for (let d = 1; d <= days; d++) {
      const date = new Date(y, m, d);
      rangeDates.push({
        iso: isoDateLocal(date),
        day: d,
        weekday: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()],
        month: months[m],
        today: d === now.getDate()
      });
    }
  }

  const rangeStart = rangeDates.length ? rangeDates[0].iso : todayIso;
  const rangeEnd = rangeDates.length ? rangeDates[rangeDates.length - 1].iso : todayIso;
  const visibleEvents = filteredCalendarEvents.filter(function(ev) {
    return ev.date >= rangeStart && ev.date <= rangeEnd;
  });
  const upcomingEvents = visibleEvents
    .filter(function(ev) { return ev.date >= todayIso; })
    .sort(function(a, b) { return String(a.date).localeCompare(String(b.date)); })
    .slice(0, 5);
  const filterLabel = typeFilter === 'all'
    ? 'All types'
    : typeFilter.charAt(0).toUpperCase() + typeFilter.slice(1);
  const channelLabel = channelFilter === 'all'
    ? 'All channels'
    : channelFilter;
  const viewLabel = viewMode === 'week' ? 'This week' : months[m] + ' ' + y;

  let html = '<div class="page-header"><div><h1 class="page-title">Calendar</h1><div class="page-sub">Internal calendar with seeded follow-up and reminders</div></div>' +
    '<div class="page-actions"><button class="btn btn-primary" onclick="openCalendarEvent()">+ New Event</button></div></div>';
  html += '<div class="analytics-strip" style="margin-top:0;">' +
    '<div class="analytics-card"><div class="tiny">Seeded events</div><strong>' + calendarEvents.length + '</strong><p>Created from onboarding so the calendar is never empty.</p></div>' +
    '<div class="analytics-card"><div class="tiny">Visible events</div><strong>' + visibleEvents.length + '</strong><p>Filtered by ' + esc(filterLabel.toLowerCase()) + ' and ' + esc(channelLabel.toLowerCase()) + ' in ' + esc(viewLabel) + '.</p></div>' +
    '<div class="analytics-card"><div class="tiny">Primary channel</div><strong>' + esc(getWs().primaryChannel || 'WhatsApp') + '</strong><p>Channel chosen during survey setup.</p></div>' +
    '<div class="analytics-card"><div class="tiny">Plan</div><strong>' + esc(getWs().plan || 'Starter') + '</strong><p>Workspace entitlement currently active.</p></div>' +
  '</div>';

  html += '<div class="calendar-toolbar">' +
    '<div class="calendar-toolbar-group">' +
      '<button type="button" class="calendar-view-btn' + (viewMode === 'month' ? ' active' : '') + '" onclick="setCalendarViewMode(\'month\')">Month</button>' +
      '<button type="button" class="calendar-view-btn' + (viewMode === 'week' ? ' active' : '') + '" onclick="setCalendarViewMode(\'week\')">Week</button>' +
    '</div>' +
    '<div class="calendar-toolbar-group">' +
      '<label class="calendar-filter"><span>Type</span><select class="form-select calendar-select" onchange="setCalendarTypeFilter(this.value)"><option value="all" ' + (typeFilter === 'all' ? 'selected' : '') + '>All types</option>' +
        '<option value="task" ' + (typeFilter === 'task' ? 'selected' : '') + '>Task</option>' +
        '<option value="follow-up" ' + (typeFilter === 'follow-up' ? 'selected' : '') + '>Follow-up</option>' +
        '<option value="meeting" ' + (typeFilter === 'meeting' ? 'selected' : '') + '>Meeting</option>' +
        '<option value="reminder" ' + (typeFilter === 'reminder' ? 'selected' : '') + '>Reminder</option>' +
        '<option value="billing" ' + (typeFilter === 'billing' ? 'selected' : '') + '>Billing</option>' +
        '<option value="approval" ' + (typeFilter === 'approval' ? 'selected' : '') + '>Approval</option>' +
        '<option value="report" ' + (typeFilter === 'report' ? 'selected' : '') + '>Report</option></select></label>' +
      '<label class="calendar-filter"><span>Channel</span><select class="form-select calendar-select" onchange="setCalendarChannelFilter(this.value)"><option value="all" ' + (channelFilter === 'all' ? 'selected' : '') + '>All channels</option>' + (availableChannels.length ? availableChannels.map(function(channel) {
        return '<option value="' + esc(channel) + '" ' + (channelFilter === channel ? 'selected' : '') + '>' + esc(channel) + '</option>';
      }).join('') : '<option value="WhatsApp">WhatsApp</option><option value="Email">Email</option><option value="Telegram">Telegram</option>') + '</select></label>' +
    '</div>' +
  '</div>';

  html += '<div style="background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:20px;">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;"><div><div style="font-size:16px;font-weight:700;">' + viewLabel + '</div><div style="font-size:12px;color:var(--ink-3);margin-top:2px;">Tap any calendar event to edit it</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;"><div class="calendar-mini-label">' + esc(filterLabel) + '</div><div class="calendar-mini-label">' + esc(channelLabel) + '</div></div></div>';

  if (viewMode === 'week') {
    html += '<div class="calendar-week-grid">';
    rangeDates.forEach(function(day) {
      const items = buildCalendarDayItems(day.iso, filteredCalendarEvents);
      html += '<div class="calendar-week-day' + (day.today ? ' today' : '') + '"><div class="calendar-week-day-head"><div><strong>' + esc(day.weekday) + '</strong><span>' + esc(day.month + ' ' + day.day) + '</span></div><div class="calendar-week-day-summary">' + esc(summarizeCalendarDayItems(items)) + '</div></div><div class="calendar-week-items">';
      if (items.length) {
        items.slice(0, 4).forEach(function(item) {
          if (item.kind === 'calendar') {
            html += '<button type="button" class="cal-event cal-event-btn" data-event-id="' + esc(item.id) + '" onclick="editCalendarEvent(this.dataset.eventId)">' + esc(item.text) + '</button>';
          } else {
            html += '<div class="cal-event cal-event-muted">' + esc(item.text) + '</div>';
          }
        });
        if (items.length > 4) {

    rangeDates.forEach(function(day) {
      const items = buildCalendarDayItems(day.iso, filteredCalendarEvents);
      html += '<div class="cal-day' + (day.today ? ' today' : '') + '"><div class="cal-day-num">' + day.day + '</div>';

function getExpenseDashboardMonthKey() {
  return localStorage.getItem(EXPENSE_MONTH_KEY) || currentExpenseMonthKey();

function setExpenseDashboardMonthKey(monthKey) {
  const next = String(monthKey || '').trim() || currentExpenseMonthKey();

}

function currentExpenseMonthKey() {
  const now = new Date();
  return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
}

function moneyFmt(value) {
  const num = Number(value) || 0;
  return num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function expenseCurrency(summary) {
  return (summary && summary.currency) || 'MYR';
}

function expenseLabel(value, currency) {
  return (currency || 'MYR') + ' ' + moneyFmt(value);
}

function buildLocalExpenseDashboard(monthKey) {
  let revenue = 0;
  let directExpenses = 0;
  let overhead = 0;
  const vendorMap = {};
  const categoryMap = {};

  D.payments.forEach(function(p) { revenue += parseFloat(p.amount) || 0; });

  const expenseRows = D.expenses.map(function(e) {
    const amount = parseFloat(e.amount) || 0;
    const vendorName = e.vendor || e.description || e.category || 'Unknown';
    const categoryName = e.category || 'Other';
    const isOverhead = /salary|software|subscription|office|admin/i.test(categoryName + ' ' + vendorName + ' ' + (e.description || ''));
    if (isOverhead) overhead += amount;
    else directExpenses += amount;
    vendorMap[vendorName] = (vendorMap[vendorName] || 0) + amount;
    if (!categoryMap[categoryName]) {
      categoryMap[categoryName] = { categoryName: categoryName, isOverhead: isOverhead, totalAmount: 0, receiptCount: 0, currency: 'MYR' };
    }
    categoryMap[categoryName].totalAmount += amount;
    categoryMap[categoryName].receiptCount += 1;
    return {
      id: e.id,
      receiptDate: e.date || '',
      vendorName: vendorName,
      categoryName: categoryName,
      totalAmount: amount,
      taxAmount: 0,
      reviewStatus: 'pending',
      ocrStatus: 'manual',
      ocrConfidence: 0.5,
      fileUrl: '',
      fileName: e.description || 'Expense',
      currency: 'MYR',
      notes: e.notes || '',
      createdAt: e.createdAt || e.date || ''
    };
  });

  const vendorBreakdown = Object.keys(vendorMap).map(function(name) {
    return { vendorName: name, totalAmount: vendorMap[name], receiptCount: expenseRows.filter(function(row) { return row.vendorName === name; }).length, currency: 'MYR' };
  }).sort(function(a, b) { return b.totalAmount - a.totalAmount; }).slice(0, 6);

  const categoryBreakdown = Object.keys(categoryMap).map(function(name) {
    return categoryMap[name];
  }).sort(function(a, b) { return b.totalAmount - a.totalAmount; }).slice(0, 6);

  const reviewQueue = expenseRows.slice(-5).reverse();
  const netProfit = revenue - directExpenses - overhead;
  const summary = {
    monthKey: monthKey,
    grossRevenue: revenue,
    totalExpenses: directExpenses,
    totalOverhead: overhead,
    netProfit: netProfit,
    receiptCount: expenseRows.length,
    approvedReceiptCount: expenseRows.length - reviewQueue.length,
    unreviewedReceiptCount: reviewQueue.length,
    currency: 'MYR',
    source: 'local'
  };
  const pnlRows = [{
    monthKey: monthKey,
    grossRevenue: revenue,
    totalExpenses: directExpenses,
    totalOverhead: overhead,
    netProfit: netProfit,
    profitMarginPct: revenue > 0 ? ((netProfit / revenue) * 100).toFixed(1) : 0,
    currency: 'MYR'
  }];
  const insights = [];
  if (reviewQueue.length) {
    insights.push({ type: 'warning', title: 'Pending receipts', message: reviewQueue.length + ' receipt(s) need review in local preview.', severity: 'medium', suggestedAction: 'Review the latest items and approve them.' });
  }
  if (netProfit < 0) {
    insights.push({ type: 'critical', title: 'Profit is negative', message: 'Local preview shows expenses above revenue.', severity: 'high', suggestedAction: 'Review overhead and active spend.' });
  }

  return {
    workspaceId: getWs().id,
    monthKey: monthKey,
    summary: summary,
    vendorBreakdown: vendorBreakdown.map(function(item) {
      return Object.assign({}, item, { sharePct: revenue > 0 ? ((item.totalAmount / revenue) * 100).toFixed(1) : 0 });
    }),
    categoryBreakdown: categoryBreakdown.map(function(item) {
      return Object.assign({}, item, { sharePct: revenue > 0 ? ((item.totalAmount / revenue) * 100).toFixed(1) : 0 });
    }),
    reviewQueue: reviewQueue,
    pnlRows: pnlRows,
    aiInsights: insights,
    meta: {
      generatedAt: new Date().toISOString(),
      snapshotUsed: false,
      liveFallbackUsed: false,
      currency: 'MYR',
      timezone: 'local-preview'
    }
  };
}

function renderExpenseDashboardError(message) {

async function loadExpenseDashboardWidget() {
  const root = document.getElementById('expense-dashboard-widget');
  if (!root) return;

  const workspace = getWs();
  const monthKey = getExpenseDashboardMonthKey();
  const requestId = ++expenseDashboardState.requestId;
  expenseDashboardState.loading = true;
  expenseDashboardState.error = '';
  root.innerHTML = renderExpenseDashboardSkeleton();

  const url = '/api/expense-dashboard?workspaceId=' + encodeURIComponent(workspace.id) + '&month=' + encodeURIComponent(monthKey) + '&includeInsights=1&includeLiveFallback=1';

  try {
    const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await response.json().catch(function() { return {}; });
    if (requestId !== expenseDashboardState.requestId) return;
    if (!response.ok || !data.success) {
      throw new Error((data && data.error && data.error.message) || data.error || 'Unable to load live expense data');
    }
    expenseDashboardState.loading = false;
    expenseDashboardState.data = data.data;
    renderExpenseDashboardFromState();
  } catch (error) {
    if (requestId !== expenseDashboardState.requestId) return;
    expenseDashboardState.loading = false;
    expenseDashboardState.error = error.message;
    const fallback = buildLocalExpenseDashboard(monthKey);
    expenseDashboardState.data = fallback;
    const rootFallback = document.getElementById('expense-dashboard-widget');
    if (rootFallback) {
      rootFallback.innerHTML = renderExpenseDashboardError(error.message) + renderExpenseDashboardWidget(fallback, { source: 'local fallback' });
      decorateExpenseReviewPanel(rootFallback, fallback);
    }
  }
}

function refreshExpenseDashboardWidget() {
  if (view !== 'accounting') return;
  void loadExpenseDashboardWidget();
}

function receiptField(item, camelKey, snakeKey, fallback) {
  if (!item) return fallback || '';
  if (item[camelKey] !== undefined && item[camelKey] !== null && item[camelKey] !== '') return item[camelKey];
  if (snakeKey && item[snakeKey] !== undefined && item[snakeKey] !== null && item[snakeKey] !== '') return item[snakeKey];
  return fallback || '';
}

function renderExpenseDashboardFromState() {
  const root = document.getElementById('expense-dashboard-widget');
  if (!root || !expenseDashboardState.data) return;
  root.innerHTML = renderExpenseDashboardWidget(expenseDashboardState.data);
  decorateExpenseReviewPanel(root, expenseDashboardState.data);
}

function decorateExpenseReviewPanel(root, data) {
  if (!root || !data) return;
  const panels = root.querySelectorAll('.expense-panel');
  const reviewPanel = Array.prototype.find.call(panels, function(panel) {
    const heading = panel.querySelector('h3');
    return heading && String(heading.textContent || '').toLowerCase().indexOf('review queue') !== -1;
  });
  if (!reviewPanel) return;

  const summary = data.summary || {};
  const currency = expenseCurrency(summary);

    const vendorName = receiptField(item, 'vendorName', 'vendor_name', receiptField(item, 'fileName', 'file_name', 'Receipt'));
    const receiptDate = receiptField(item, 'receiptDate', 'receipt_date', '');
    const categoryName = receiptField(item, 'categoryName', 'category_name', receiptField(item, 'expenseType', 'expense_type', 'Uncategorized'));
    const totalAmount = receiptField(item, 'totalAmount', 'total_amount', 0);
    const itemCurrency = receiptField(item, 'currency', 'currency', currency);
    const reviewStatus = String(receiptField(item, 'reviewStatus', 'review_status', 'pending') || 'pending').toLowerCase();
    const confidence = Number(receiptField(item, 'ocrConfidence', 'ocr_confidence', 0) || 0);
    const confidenceText = confidence > 1 ? Math.round(confidence) + '%' : Math.round(confidence * 100) + '%';
    const chipTone = reviewStatus === 'approved' ? 'good' : reviewStatus === 'flagged' ? 'warn' : '';
    const checked = selectedSet.has(id) ? 'checked' : '';
    const fileUrl = receiptField(item, 'fileUrl', 'file_url', '');
    const hasFile = !!String(fileUrl || '').trim();
    return '<div class="expense-item" data-receipt-id="' + esc(id) + '">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">' +
        '<label style="display:flex;align-items:flex-start;gap:10px;flex:1;cursor:pointer;">' +
          '<input type="checkbox" ' + checked + ' onchange="toggleExpenseReceiptSelection(\'' + esc(id) + '\', this.checked)" style="margin-top:4px;">' +
          '<div style="flex:1;">' +
            '<div class="expense-item-head">' +
              '<div><div class="expense-item-title">' + esc(vendorName || 'Receipt') + '</div><div class="expense-item-sub">' + esc(receiptDate || '') + ' • ' + esc(categoryName || 'Uncategorized') + '</div></div>' +
              '<span class="expense-chip ' + chipTone + '">' + esc(reviewStatus) + '</span>' +
            '</div>' +
            '<div class="expense-item-sub" style="margin-top:8px;">' + esc(expenseLabel(totalAmount, itemCurrency)) + ' • OCR ' + esc(confidenceText) + '</div>' +
          '</div>' +
        '</label>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:10px;justify-content:flex-start;gap:8px;flex-wrap:wrap;">' +
        '<button type="button" class="btn btn-ghost" onclick="openReceiptPreview(\'' + esc(id) + '\')"' + (hasFile ? '' : ' disabled') + '>Preview</button>' +
        '<button type="button" class="btn btn-ghost" onclick="downloadReceipt(\'' + esc(id) + '\')"' + (hasFile ? '' : ' disabled') + '>Download</button>' +
        '<button type="button" class="btn btn-ghost" onclick="reviewExpenseReceipt(\'' + esc(id) + '\', \'approved\')">Approve</button>' +
        '<button type="button" class="btn btn-ghost" onclick="reviewExpenseReceipt(\'' + esc(id) + '\', \'flagged\')">Flag</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="expense-empty-state">No receipts waiting for review.</div>';

  reviewPanel.innerHTML = header + body;
}

function toggleExpenseReceiptSelection(receiptId, checked) {
  const selected = expenseDashboardState.selectedReceiptIds || new Set();
  const id = String(receiptId || '').trim();
  if (!id) return;
  if (checked) selected.add(id);
  else selected.delete(id);
  expenseDashboardState.selectedReceiptIds = selected;
  renderExpenseDashboardFromState();
}

function setAllReceiptSelections(checked) {
  const selected = new Set();
  if (checked && expenseDashboardState.data && Array.isArray(expenseDashboardState.data.reviewQueue)) {
    expenseDashboardState.data.reviewQueue.forEach(function(item) {
      const id = String(receiptField(item, 'id', 'id', '') || '').trim();
      if (id) selected.add(id);
    });
  }
  expenseDashboardState.selectedReceiptIds = selected;
  renderExpenseDashboardFromState();
}

function clearExpenseReceiptSelection() {
  expenseDashboardState.selectedReceiptIds = new Set();
  renderExpenseDashboardFromState();
}

async function requestExpenseReceiptAsset(receiptId) {
  const workspace = getWs();
  if (!receiptId) return null;
  const response = await fetch('/api/expense-receipts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      action: 'sign',
      workspaceId: workspace.id,
      ownerId: workspace.ownerId || '',
      receiptId: receiptId,
      expiresIn: 900
    })
  });
  const data = await response.json().catch(function() { return {}; });
  if (!response.ok || !data.success) {
    throw new Error((data && data.error && data.error.message) || data.error || 'Unable to sign receipt asset');
  }
  return data.data || null;
}

function openReceiptPreviewModal(payload) {
  const previewUrl = String(payload && (payload.signedUrl || payload.fileUrl) || '').trim();
  const downloadUrl = String(payload && payload.downloadUrl || previewUrl).trim();
  const receipt = payload && payload.receipt ? payload.receipt : {};
  const timeline = payload && Array.isArray(payload.timeline) ? payload.timeline : [];
  const mimeType = String(receipt.mime_type || receipt.mimeType || '').toLowerCase();
  const fileName = String(receipt.file_name || receipt.fileName || 'receipt').trim();
  const title = String(receipt.vendor_name || receipt.vendorName || fileName || 'Receipt').trim();
  const form = document.getElementById('main-form');
  document.getElementById('modal-title').textContent = 'Receipt Preview';

  let previewHtml = '<div class="expense-empty-state">Preview unavailable.</div>';
  if (previewUrl) {
    if (mimeType.indexOf('image/') === 0) {
      previewHtml = '<img src="' + esc(previewUrl) + '" alt="' + esc(title) + '" style="max-width:100%;border-radius:14px;border:1px solid var(--border);display:block;margin:0 auto;">';
    } else if (mimeType === 'application/pdf' || /\.pdf$/i.test(fileName)) {
      previewHtml = '<iframe src="' + esc(previewUrl) + '" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:14px;background:#fff;"></iframe>';
    } else {
      previewHtml = '<div class="expense-empty-state">This file can be opened in a new tab or downloaded.</div>';
    }
  }

  form.innerHTML = '<div class="form-group"><div class="expense-item-title" style="margin-bottom:8px;">' + esc(title) + '</div><div class="expense-item-sub" style="margin-bottom:12px;">' + esc(receipt.receipt_date || receipt.receiptDate || '') + ' • ' + esc(expenseLabel(receipt.total_amount || receipt.totalAmount || 0, receipt.currency || 'MYR')) + '</div>' + previewHtml + renderReceiptTimelineHtml(timeline) + '</div><div class="btn-row" style="margin-top:16px;"><div><button type="button" class="btn btn-ghost" onclick="closeModal()">Close</button></div><div class="btn-row" style="gap:8px;"><button type="button" class="btn btn-ghost" onclick="triggerReceiptDownload(\'' + esc(downloadUrl) + '\')">Download</button><button type="button" class="btn btn-primary" onclick="openUrlInNewTab(\'' + esc(previewUrl) + '\')">Open</button></div></div>';
  document.getElementById('modal').classList.add('active');
}

function openUrlInNewTab(url) {
  const target = String(url || '').trim();
  if (!target) return;
  window.open(target, '_blank', 'noopener');
}

function triggerReceiptDownload(url) {
  const target = String(url || '').trim();
  if (!target) return;
  const link = document.createElement('a');
  link.href = target;
  link.target = '_blank';
  link.rel = 'noopener';
  link.download = '';
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function formatReceiptTimelineTime(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  const date = new Date(raw);
  if (Number.isNaN(date.getTime())) return raw;
  try {
    return date.toLocaleString(undefined, {
      year: 'numeric',
      month: 'short',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });
  } catch (error) {
    return date.toISOString();
  }
}

function renderReceiptTimelineHtml(timeline) {
  const list = Array.isArray(timeline) ? timeline.filter(Boolean) : [];
  if (!list.length) {
    return '<div class="expense-empty-state" style="margin-top:16px;">No status timeline yet.</div>';
  }

  const rows = list.map(function(item) {
    const status = String(item.status || '').trim();
    const source = String(item.source || 'system').trim();
    const label = String(item.label || item.type || 'Update').trim();
    const timeLabel = formatReceiptTimelineTime(item.at);
    const detailBits = [];
    const details = item.details && typeof item.details === 'object' ? item.details : {};
    if (details.fileName) detailBits.push('File: ' + esc(details.fileName));
    if (details.vendorName) detailBits.push('Vendor: ' + esc(details.vendorName));
    if (details.modelName) detailBits.push('Model: ' + esc(details.modelName));
    if (details.confidenceScore !== undefined && details.confidenceScore !== null && details.confidenceScore !== '') {
      detailBits.push('Confidence: ' + esc(String(details.confidenceScore)));
    }
    if (details.notes) detailBits.push(esc(String(details.notes)));
    return (
      '<div class="timeline-item" style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border);">' +
        '<div style="width:11px;height:11px;border-radius:999px;background:' + esc(status === 'approved' ? 'var(--green)' : status === 'flagged' || status === 'rejected' ? 'var(--red)' : 'var(--accent)') + ';margin-top:6px;flex:0 0 auto;"></div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;">' +
            '<strong style="font-size:13px;">' + esc(label) + '</strong>' +
            '<span class="expense-chip" style="font-size:10px;">' + esc(status || 'info') + '</span>' +
          '</div>' +
          '<div style="font-size:12px;color:var(--ink-3);margin-top:4px;">' + esc(timeLabel || '') + (source ? ' • ' + esc(source) : '') + '</div>' +
          (detailBits.length ? '<div style="font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.45;">' + detailBits.join(' • ') + '</div>' : '') +
        '</div>' +
      '</div>'
    );
  }).join('');

  return '<div class="receipt-timeline" style="margin-top:16px;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--bg-2);"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:4px;"><strong style="font-size:13px;">Status timeline</strong><span style="font-size:11px;color:var(--ink-3);">Audit trail</span></div>' + rows + '</div>';
}

async function openReceiptPreview(receiptId) {
  try {
    const payload = await requestExpenseReceiptAsset(receiptId);
    if (!payload) return;
    openReceiptPreviewModal(payload);
  } catch (error) {
    notify('⚠️ ' + error.message);
  }
}

async function downloadReceipt(receiptId) {
  try {
    const payload = await requestExpenseReceiptAsset(receiptId);
    const downloadUrl = String(payload && payload.downloadUrl || payload && payload.signedUrl || payload && payload.fileUrl || '').trim();
    if (!downloadUrl) throw new Error('Download link unavailable');
    const link = document.createElement('a');
    link.href = downloadUrl;
    link.target = '_blank';
    link.rel = 'noopener';
    link.download = '';
    document.body.appendChild(link);
    link.click();
    link.remove();
  } catch (error) {
    notify('⚠️ ' + error.message);
  }
}

async function reviewSelectedExpenseReceipts(reviewStatus) {
  const selectedIds = Array.from(expenseDashboardState.selectedReceiptIds || []);
  if (!selectedIds.length) {
    notify('⚠️ Select at least one receipt first');
    return;
  }

  notify('Updating ' + selectedIds.length + ' receipt(s)...');
  try {
    await Promise.all(selectedIds.map(function(receiptId) {
      return reviewExpenseReceipt(receiptId, reviewStatus, { refresh: false, quiet: true });
    }));
    clearExpenseReceiptSelection();
    notify('✅ ' + selectedIds.length + ' receipt(s) ' + reviewStatus);
    refreshExpenseDashboardWidget();
  } catch (error) {
    notify('⚠️ ' + error.message);
  }
}

  editId = null;

form-group"><label class="form-label">OCR Text / Notes</label><textarea class="form-textarea" id="er-ocrText" placeholder="Paste OCR text or receipt notes here..."></textarea></div><div class="form-group"><label class="form-label">Review Status</label><select class="form-select" id="er-reviewStatus"><option value="pending">Pending</option><option value="approved">Approved</option><option value="flagged">Flagged</option><option value="rejected">Rejected</option></select></div><div class="btn-row"><div><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button></div><div><button type="submit" class="btn btn-primary">Save Receipt</button></div></div>';

  if (fileInput && fileNameInput && fileStatus) {

      }

      fileStatus.textContent = file.name + ' • ' + Math.round((file.size || 0) / 1024) + ' KB • ' + (file.type || 'application/octet-stream');

function readFileAsDataUrl(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function() { resolve(String(reader.result || '')); };
    reader.onerror = function() { reject(reader.error || new Error('Unable to read file')); };
    reader.readAsDataURL(file);
  });
}

async function saveExpenseReceiptUpload() {
  const workspace = getWs();
  const fileInput = document.getElementById('er-file');
  const file = fileInput && fileInput.files ? fileInput.files[0] : null;
  let fileDataUrl = '';
  let fileMimeType = '';
  let fileSize = 0;
  if (file) {
    fileDataUrl = await readFileAsDataUrl(file);
    fileMimeType = file.type || '';
    fileSize = file.size || 0;
  }
  const payload = {
    action: 'create',
    workspaceId: workspace.id,
    ownerId: workspace.ownerId || '',
    fileName: getV('er-fileName'),
    fileUrl: getV('er-fileUrl'),
    fileDataUrl: fileDataUrl,
    mimeType: fileMimeType,
    fileSize: fileSize,
    receiptDate: getV('er-receiptDate'),
    vendorName: getV('er-vendorName'),
    totalAmount: parseFloat(getV('er-totalAmount')) || 0,
    taxAmount: parseFloat(getV('er-taxAmount')) || 0,
    categoryId: getV('er-categoryId'),
    expenseType: getV('er-expenseType'),
    ocrText: getV('er-ocrText'),
    reviewStatus: getV('er-reviewStatus')
  };

  notify('Uploading receipt...');
  try {
    const response = await fetch('/api/expense-receipts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(function() { return {}; });
    if (!response.ok || !data.success) {
      throw new Error((data && data.error && data.error.message) || data.error || 'Unable to save receipt');
    }
    closeModal();
    const storageInfo = data && data.data && data.data.storage ? data.data.storage : null;
    if (storageInfo && storageInfo.uploaded === false && storageInfo.uploadError) {
      notify('✅ Receipt saved, but file upload was skipped: ' + storageInfo.uploadError);
    } else {
      notify('✅ Receipt saved and OCR scaffold created');
    }
    refreshExpenseDashboardWidget();
  } catch (error) {
    notify('⚠️ ' + error.message);
  }
}

async function reviewExpenseReceipt(receiptId, reviewStatus, options) {
  const workspace = getWs();
  if (!receiptId) return;
  options = options || {};
  try {
    const response = await fetch('/api/expense-receipts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        action: 'review',
        workspaceId: workspace.id,
        ownerId: workspace.ownerId || '',
        receiptId: receiptId,
        reviewStatus: reviewStatus
      })
    });
    const data = await response.json().catch(function() { return {}; });
    if (!response.ok || !data.success) {
      throw new Error((data && data.error && data.error.message) || data.error || 'Unable to update receipt');
    }
    if (expenseDashboardState.selectedReceiptIds) {
      expenseDashboardState.selectedReceiptIds.delete(String(receiptId));
    }
    if (!options.quiet) notify('✅ Receipt ' + reviewStatus);
    if (options.refresh !== false) refreshExpenseDashboardWidget();
  } catch (error) {
    if (!options.quiet) notify('⚠️ ' + error.message);
    throw error;
  }
}

function renderReports(c) {
  let revenue = 0, expenses = 0;
  D.payments.forEach(function(p) { revenue += parseFloat(p.amount) || 0; });
  D.expenses.forEach(function(e) { expenses += parseFloat(e.amount) || 0; });
  const profit = revenue - expenses;
  const margin = revenue > 0 ? ((profit / revenue) * 100).toFixed(1) : 0;
  const expenseRatio = revenue > 0 ? ((expenses / revenue) * 100).toFixed(1) : 0;
  const paidInvoices = D.invoices.filter(function(i) { return i.status === 'paid'; }).length;
  const overdueInvoices = D.invoices.filter(function(i) { return i.status === 'overdue'; }).length;
  const openInvoices = D.invoices.filter(function(i) { return i.status !== 'paid'; }).length;
  const collectionRate = D.invoices.length ? Math.round((paidInvoices / D.invoices.length) * 100) : 0;
  const outstanding = Math.max(0, D.invoices.reduce(function(sum, inv) { return sum + (parseFloat(inv.amount) || 0); }, 0) - revenue);
  const activeClients = D.clients.filter(function(item) { return item.status !== 'Inactive' && item.status !== 'Closed'; }).length;
  const openTasks = D.tasks.filter(function(task) { return task.status !== 'done'; }).length;
  const hotLeads = D.leads.filter(function(lead) { return lead.status === 'new' || lead.status === 'qualified'; }).length;
  const avgInvoice = D.invoices.length ? Math.round(D.invoices.reduce(function(sum, inv) { return sum + (parseFloat(inv.amount) || 0); }, 0) / D.invoices.length) : 0;
  const maxMix = Math.max(revenue, expenses, Math.abs(profit), 1);
  const maxOps = Math.max(openTasks, hotLeads, activeClients, 1);
  const maxBilling = Math.max(revenue, outstanding, 1);

  function chartRow(label, value, display, tone, max) {
    const pct = Math.max(8, Math.round((Math.abs(Number(value) || 0) / max) * 100));
    return '<div class="report-exec-bar-row">' +
      '<div class="report-exec-bar-meta"><span>' + esc(label) + '</span><strong>' + esc(display) + '</strong></div>' +

    '<div class="report-exec-grid">' +
      '<div class="report-exec-card"><div class="tiny">Topline versus costs</div><strong>Performance Mix</strong><div class="report-exec-bars">' +
        chartRow('Revenue', revenue, 'RM ' + revenue.toLocaleString(), 'good', maxMix) +
        chartRow('Expenses', expenses, 'RM ' + expenses.toLocaleString(), 'bad', maxMix) +
        chartRow('Net profit', profit, 'RM ' + profit.toLocaleString(), profit >= 0 ? 'good' : 'bad', maxMix) +
      '</div><div class="report-exec-metrics"><div class="report-exec-chip"><span>Margin</span><strong>' + margin + '%</strong></div><div class="report-exec-chip"><span>Expense ratio</span><strong>' + expenseRatio + '%</strong></div><div class="report-exec-chip"><span>Cash result</span><strong>RM ' + profit.toLocaleString() + '</strong></div></div></div>' +
      '<div class="report-exec-card"><div class="tiny">Billing pressure</div><strong>Collection Health</strong><div class="report-exec-bars">' +
        chartRow('Collected', revenue, 'RM ' + revenue.toLocaleString(), 'good', maxBilling) +
        chartRow('Outstanding', outstanding, 'RM ' + outstanding.toLocaleString(), 'warn', maxBilling) +
        chartRow('Collection rate', collectionRate, collectionRate + '%', 'good', 100) +
      '</div><div class="report-exec-metrics"><div class="report-exec-chip"><span>Paid invoices</span><strong>' + paidInvoices + '</strong></div><div class="report-exec-chip"><span>Overdue invoices</span><strong>' + overdueInvoices + '</strong></div><div class="report-exec-chip"><span>Avg invoice</span><strong>RM ' + avgInvoice.toLocaleString() + '</strong></div></div></div>' +
      '<div class="report-exec-card"><div class="tiny">Daily operational load</div><strong>Operational Load</strong><div class="report-exec-bars">' +
        chartRow('Open tasks', openTasks, String(openTasks), 'warn', maxOps) +
        chartRow('Hot leads', hotLeads, String(hotLeads), 'good', maxOps) +
        chartRow('Active clients', activeClients, String(activeClients), 'good', maxOps) +
      '</div><div class="report-exec-metrics"><div class="report-exec-chip"><span>Backlog</span><strong>' + openTasks + '</strong></div><div class="report-exec-chip"><span>Hot leads</span><strong>' + hotLeads + '</strong></div><div class="report-exec-chip"><span>Client base</span><strong>' + activeClients + '</strong></div></div></div>' +
    '</div>';

  c.innerHTML = '<div class="page-header"><div><h1 class="page-title">Reports</h1><div class="page-sub">Revenue, P&L, performance</div></div><button class="btn btn-ghost" onclick="exportCSV()">📥 Export CSV</button></div>' +
    execGrid +
    '<div class="stats">' +
      '<div class="stat-card positive"><div class="stat-card-label">Total Revenue</div><div class="stat-card-num">RM ' + revenue.toLocaleString() + '</div></div>' +
      '<div class="stat-card negative"><div class="stat-card-label">Total Expenses</div><div class="stat-card-num">RM ' + expenses.toLocaleString() + '</div></div>' +
      '<div class="stat-card ' + (profit >= 0 ? 'positive' : 'negative') + '"><div class="stat-card-label">Net Profit</div><div class="stat-card-num">RM ' + profit.toLocaleString() + '</div><div class="stat-card-sub">' + margin + '% margin</div></div>' +
      '<div class="stat-card"><div class="stat-card-label">Total Clients</div><div class="stat-card-num">' + D.clients.length + '</div></div>' +
    '</div>' +
    '<div class="analytics-strip">' +
      '<div class="analytics-card"><div class="tiny">Paid invoices</div><strong>' + paidInvoices + '/' + D.invoices.length + '</strong><p>Collection volume this period.</p></div>' +
      '<div class="analytics-card"><div class="tiny">Overdue invoices</div><strong>' + overdueInvoices + '</strong><p>Needs follow-up and reminders.</p></div>' +
      '<div class="analytics-card"><div class="tiny">Open invoices</div><strong>' + openInvoices + '</strong><p>Waiting for payment or closure.</p></div>' +
      '<div class="analytics-card"><div class="tiny">Profit signal</div><strong>' + (profit >= 0 ? 'Healthy' : 'Watch') + '</strong><p>' + (profit >= 0 ? 'Revenue is ahead of expenses.' : 'Expenses are ahead of revenue.') + '</p></div>' +
    '</div>' +
    '<div class="analytics-strip">' +
      '<div class="analytics-card"><div class="tiny">Collection rate</div><strong>' + collectionRate + '%</strong><p>Paid invoices versus total billed value.</p></div>' +
      '<div class="analytics-card"><div class="tiny">Outstanding amount</div><strong>RM ' + outstanding.toLocaleString() + '</strong><p>Amount still to collect.</p></div>' +
      '<div class="analytics-card"><div class="tiny">Open tasks</div><strong>' + openTasks + '</strong><p>Tasks still waiting for action.</p></div>' +
      '<div class="analytics-card"><div class="tiny">Hot leads</div><strong>' + hotLeads + '</strong><p>Leads ready for follow-up.</p></div>' +
    '</div>' +
    '<div class="report-row"><div class="report-card"><h3>📈 P&L Statement</h3><div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><span>Revenue</span><strong style="color:var(--green);">+RM ' + revenue.toLocaleString() + '</strong></div><div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><span>Expenses</span><strong style="color:var(--red);">-RM ' + expenses.toLocaleString() + '</strong></div><div style="display:flex;justify-content:space-between;padding:12px 0 0;font-size:16px;"><strong>Net Profit</strong><strong style="color:' + (profit >= 0 ? 'var(--green)' : 'var(--red)') + ';">RM ' + profit.toLocaleString() + '</strong></div></div></div>' +
    '<div class="report-row"><div class="report-card"><h3>📊 Module Summary</h3><div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Tasks</span><strong>' + D.tasks.length + '</strong></div><div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Leads</span><strong>' + D.leads.length + '</strong></div><div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Clients</span><strong>' + D.clients.length + '</strong></div><div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Services</span><strong>' + D.services.length + '</strong></div><div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Cases</span><strong>' + D.cases.length + '</strong></div><div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Invoices</span><strong>' + D.invoices.length + '</strong></div></div></div>';

// WhatsApp state - per workspace
function getWAServiceUrl() {
  return localStorage.getItem('work2u-wa-service') || '';
}
function getWAApiKey() {
  return localStorage.getItem('work2u-wa-key') || '';
}
function getWAServiceConfigured() {
  return !!getWAServiceUrl() && !!getWAApiKey();
}

let waConnected = false;
let waMessages = JSON.parse(localStorage.getItem('work2u-wa-messages') || '{}');
let waActiveChat = null;
let waQRCode = null;
let waPollInterval = null;

function renderWhatsApp(c) {
  if (!getWAServiceConfigured()) {
    c.innerHTML = '<div class="page-header"><div><h1 class="page-title">WhatsApp</h1><div class="page-sub">Connect WhatsApp to chat with clients</div></div></div>' +

      '<div class="form-group"><label class="form-label">Service URL</label><input type="text" class="form-input" id="wa-service-url-input" placeholder="https://whatsapp-service-production-1506.up.railway.app" value="https://whatsapp-service-production-1506.up.railway.app"></div>' +
      '<div class="form-group"><label class="form-label">API Key</label><input type="password" class="form-input" id="wa-api-key-input" placeholder="Generate with: openssl rand -hex 32" value="work2u_ea70647241977eaa7f8a412cc3e34355c0820594484f67e9"></div>' +
      '<button class="btn btn-primary" onclick="saveWASettings()" style="margin-top:8px;">Save & Continue</button>' +

      '<strong>Deploy Steps:</strong><br>1. Push <code style="background:var(--surface);padding:2px 6px;border-radius:4px;">/whatsapp-service</code> to Railway/Render<br>' +

    : '<div class="wa-status-card" style="background:linear-gradient(135deg, var(--ink-3), var(--ink-2));"><div class="wa-status-dot offline"></div><div><div style="font-weight:700;">WhatsApp Not Connected</div><div style="font-size:11px;opacity:0.9;">Workspace: ' + esc(getWs().name) + ' - Click below to scan QR</div></div></div>';

  c.innerHTML = '<div class="page-header"><div><h1 class="page-title">WhatsApp</h1><div class="page-sub">Chat with clients from your CRM (workspace: ' + esc(getWs().name) + ')</div></div>' + (waConnected ? '<button class="btn btn-primary" onclick="newChat()">+ New Chat</button>' : '<button class="btn btn-ghost" onclick="showWASettings()">⚙️ Settings</button>') + '</div>' +
    statusHtml +

  if (waConnected) {
    renderWAChat();
  } else {
    renderWAConnect();

function saveWASettings() {
  const url = document.getElementById('wa-service-url-input').value.trim().replace(/\/$/, '');
  const key = document.getElementById('wa-api-key-input').value.trim();
  if (!url || !key) { notify('⚠️ Both fields required'); return; }
  localStorage.setItem('work2u-wa-service', url);
  localStorage.setItem('work2u-wa-key', key);
  notify('✅ WhatsApp service configured');
  render();
}

function showWASettings() {
  const url = getWAServiceUrl();
  const key = getWAApiKey();
  const newUrl = prompt('WhatsApp Service URL:', url);
  if (newUrl === null) return;
  const newKey = prompt('API Key:', key);
  if (newKey === null) return;
  localStorage.setItem('work2u-wa-service', newUrl.trim().replace(/\/$/, ''));
  localStorage.setItem('work2u-wa-key', newKey.trim());
  notify('✅ Settings updated');
  render();
}

async function renderWAConnect() {
  const c = document.getElementById('wa-container');
  if (!c) return;
  
  c.innerHTML = '<div style="background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:32px;display:grid;place-items:center;text-align:center;max-width:480px;margin:0 auto;">' +
    '<div class="wa-qr-box" id="wa-qr-box"><div style="padding:40px;color:var(--ink-3);">⏳ Generating QR...</div></div>' +
    '<div style="margin-top:20px;"><h3 style="font-size:16px;font-weight:700;margin-bottom:8px;">Scan with WhatsApp</h3>' +
    '<p style="color:var(--ink-2);font-size:13px;margin-bottom:8px;">Open WhatsApp on your phone → Settings → Linked Devices → Link a Device</p>' +
    '<p style="color:var(--ink-3);font-size:11px;">Workspace: <strong>' + esc(getWs().name) + '</strong></p>' +
    '</div></div>';
  
  if (waPollInterval) clearInterval(waPollInterval);
  
  const poll = async function() {
    const wsId = getWs().id;
    try {
      const r = await fetch(getWAServiceUrl() + '/api/sessions/' + encodeURIComponent(wsId) + '/qr', {
        headers: { 'Authorization': 'Bearer ' + getWAApiKey() }
      });
      const data = await r.json();
      
      if (data.connected) {
        waConnected = true;
        if (waPollInterval) clearInterval(waPollInterval);
        notify('✅ WhatsApp connected!');
        render();
        return;
      } else if (data.qr) {
        const qrBox = document.getElementById('wa-qr-box');
        if (qrBox && !waConnected) {
          qrBox.innerHTML = '<img src="' + data.qr + '" style="max-width:300px;width:100%;border-radius:8px;" alt="QR">';
        }
      } else if (data.status === 'initializing') {
        const qrBox = document.getElementById('wa-qr-box');
        if (qrBox) qrBox.innerHTML = '<div style="padding:20px;color:var(--ink-3);">⏳ Initializing...</div>';
      } else if (data.status === 'auth_failed' || data.status === 'init_failed') {
        const qrBox = document.getElementById('wa-qr-box');
        if (qrBox) qrBox.innerHTML = '<div style="padding:20px;color:var(--red);">❌ ' + data.status + '</div>';
      }
    } catch (e) {
      console.error('QR poll error:', e);
      const qrBox = document.getElementById('wa-qr-box');
      if (qrBox) qrBox.innerHTML = '<div style="padding:20px;text-align:center;"><div style="color:var(--red);font-weight:600;margin-bottom:8px;">⚠️ Cannot reach WhatsApp service</div><div style="color:var(--ink-3);font-size:11px;">' + esc(getWAServiceUrl()) + '</div></div>';
      if (waPollInterval) clearInterval(waPollInterval);
    }
  };
  
  poll();
  waPollInterval = setInterval(poll, 3000);
}

async function disconnectWA() {
  if (!confirm('Disconnect WhatsApp from this workspace?')) return;
  try {
    await fetch(getWAServiceUrl() + '/api/sessions/' + encodeURIComponent(getWs().id) + '/disconnect', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getWAApiKey() }
    });
  } catch (e) {}
  waConnected = false;
  if (waPollInterval) clearInterval(waPollInterval);
  notify('WhatsApp disconnected');
  render();
}

async function renderWAChat() {
  const c = document.getElementById('wa-container');
  if (!c) return;

  const contactList = new Set();
  D.clients.forEach(function(cl) { if (cl.phone) contactList.add(cl.phone); });
  Object.keys(waMessages).forEach(function(k) { contactList.add(k); });
  
  const contacts = Array.from(contactList);
  const activeContact = waActiveChat || (contacts[0] || '');
  const activeMessages = activeContact && waMessages[activeContact] ? waMessages[activeContact] : [];
  
  let contactsHtml = '';
  contacts.forEach(function(phone) {
    const msgs = waMessages[phone] || [];
    const last = msgs.length > 0 ? msgs[msgs.length - 1] : null;
    const name = D.clients.find(function(cl) { return cl.phone === phone; });
    const display = name ? name.name : phone;
    const initial = display.charAt(0).toUpperCase();
    const unread = msgs.filter(function(m) { return m.from === 'them' && !m.read; }).length;
    contactsHtml += '<div class="wa-contact ' + (phone === activeContact ? 'active' : '') + '" onclick="selectWAChat(\'' + phone + '\')">' +
      '<div class="wa-avatar">' + initial + '</div>' +
      '<div class="wa-contact-info"><div class="wa-contact-name">' + esc(display) + '</div>' +
      '<div class="wa-contact-preview">' + esc(last ? last.text : 'No messages yet') + '</div></div>' +
      (unread > 0 ? '<span class="wa-badge">' + unread + '</span>' : '') +
      '</div>';
  });

  let messagesHtml = '';
  activeMessages.forEach(function(m) {
    messagesHtml += '<div class="wa-msg ' + m.from + '">' + esc(m.text) + '<div class="wa-msg-time">' + esc(m.time) + '</div></div>';
  });

  const activeName = D.clients.find(function(cl) { return cl.phone === activeContact; });
  const activeDisplay = activeName ? activeName.name : (activeContact || 'Select a chat');

  c.innerHTML = '<div class="wa-sidebar">' +
    '<div class="wa-search"><input type="text" placeholder="🔍 Search chats..." oninput="filterWA(this.value)"></div>' +
    '<div class="wa-tabs"><button class="wa-tab active">All</button><button class="wa-tab">Unread</button><button class="wa-tab">Groups</button></div>' +
    '<div class="wa-list">' + (contactsHtml || '<div style="padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px;">No chats yet</div>') + '</div>' +
    '</div>' +
    '<div class="wa-chat">' +
    '<div class="wa-chat-header"><div style="display:flex;align-items:center;gap:10px;"><div class="wa-avatar">' + (activeDisplay.charAt(0).toUpperCase() || '?') + '</div><div><div style="font-weight:700;font-size:14px;">' + esc(activeDisplay) + '</div><div style="font-size:11px;color:var(--green);">● Online</div></div></div>' +
    '<div style="display:flex;gap:6px;"><button class="icon-btn" title="Voice call"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button></div>' +
    '</div>' +
    '<div class="wa-chat-messages" id="wa-msgs">' + (messagesHtml || '<div style="text-align:center;padding:40px;color:var(--ink-3);font-size:13px;">Start a conversation</div>') + '</div>' +
    '<form class="wa-chat-input" onsubmit="event.preventDefault(); sendWAMsg();"><input type="text" id="wa-input" placeholder="Type a message..."><button type="submit" class="btn btn-primary">Send</button></form>' +
    '</div>';

  const msgs = document.getElementById('wa-msgs');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

function selectWAChat(phone) {
  waActiveChat = phone;
  if (waMessages[phone]) {
    waMessages[phone].forEach(function(m) { m.read = true; });
    localStorage.setItem('work2u-wa-messages', JSON.stringify(waMessages));
  }
  renderWAChat();
}

async function sendWAMsg() {
  const input = document.getElementById('wa-input');
  const text = input.value.trim();
  if (!text || !waActiveChat) return;

  try {
    const r = await fetch(getWAServiceUrl() + '/api/sessions/' + encodeURIComponent(getWs().id) + '/messages/send', {
      method: 'POST',
      headers: { 
        'Authorization': 'Bearer ' + getWAApiKey(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ phone: waActiveChat, message: text })
    });
    
    if (!r.ok) {
      const err = await r.json().catch(function() { return {}; });
      notify('⚠️ ' + (err.error || 'Send failed'));
      return;
    }
  } catch (e) {
    notify('⚠️ Cannot reach WhatsApp service');
    return;
  }

  if (!waMessages[waActiveChat]) waMessages[waActiveChat] = [];
  waMessages[waActiveChat].push({
    from: 'me',
    text: text,
    time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
  });
  localStorage.setItem('work2u-wa-messages', JSON.stringify(waMessages));
  input.value = '';
  renderWAChat();
}

function newChat() {
  const phone = prompt('Phone number (with country code, e.g. +60123456789):');
  if (!phone) return;
  waActiveChat = phone.replace(/[^\d+]/g, '');
  renderWAChat();
}

function filterWA(query) {
  const contacts = document.querySelectorAll('.wa-contact');
  contacts.forEach(function(c) {
    const text = c.textContent.toLowerCase();
    c.style.display = text.includes(query.toLowerCase()) ? 'flex' : 'none';

function handleBillingReturn() {
  const params = new URLSearchParams(window.location.search);
  const billing = params.get('billing');
  const plan = params.get('plan');
  const provider = params.get('provider');
  const surveyFlag = params.get('survey') === '1';

  if (!billing && !provider && !surveyFlag) return;

  if (billing === 'success' && plan) {
    const ws = getWs();
    ws.plan = plan.charAt(0).toUpperCase() + plan.slice(1);
    saveWs();
    updateWsUI();
    saveBillingState({
      status: provider === 'stripe' ? 'trialing' : 'active',
      provider: provider || 'stripe',
      plan: ws.plan,
      updatedAt: new Date().toISOString()
    });
    notify('✅ ' + ws.name + ' is now on ' + ws.plan);
  } else if (billing === 'pending') {
    saveBillingState({
      status: 'pending',
      provider: provider || '',
      plan: plan || getWs().plan || 'Starter',
      updatedAt: new Date().toISOString()
    });
    notify('⏳ Payment received. We are verifying your subscription.');
  } else if (billing === 'cancelled') {
    notify('⚠️ Checkout cancelled');
  } else if (billing === 'error') {
    notify('⚠️ Payment could not be completed');
  }

  if (surveyFlag) {
    applySurveyContextToWorkspace();
    seedWorkspaceFromSurvey(loadSurveyContext());
    const ws = getWs();
    notify('Survey setup loaded for ' + ws.name + ' (' + (ws.plan || 'Starter') + ')');
  }

  window.history.replaceState({}, document.title, window.location.pathname);
}

function askAI() {
  const input = document.getElementById('ai-input');
  const q = input.value.trim();
  if (!q) return;
  const history = load(K.aiHistory);
  history.push({ role: 'user', text: q, at: Date.now() });
  localStorage.setItem(K.aiHistory, JSON.stringify(history));
  input.value = '';
  renderAI(document.getElementById('main'));
  fetch('/api/ai/groq', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: q })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      const h = load(K.aiHistory);
      h.push({ role: 'assistant', text: data.text || data.error || 'Sorry, I couldn\'t process that.', at: Date.now() });
      localStorage.setItem(K.aiHistory, JSON.stringify(h));
      renderAI(document.getElementById('main'));
    })
    .catch(function() {
      const h = load(K.aiHistory);
      h.push({ role: 'assistant', text: '⚠️ AI service unavailable. Please try again later.', at: Date.now() });
      localStorage.setItem(K.aiHistory, JSON.stringify(h));
      renderAI(document.getElementById('main'));
    });
}

function handleSave() {
  const type = view;
  let item;
  if (type === 'tasks') item = { name: getV('f-name'), priority: getV('f-priority'), status: getV('f-status'), due: getV('f-due'), tag: getV('f-tag'), notes: getV('f-notes') };
  else if (type === 'leads') item = { name: getV('f-name'), company: getV('f-company'), value: parseFloat(getV('f-value')) || 0, email: getV('f-email'), phone: getV('f-phone'), status: getV('f-status'), followup: getV('f-followup'), notes: getV('f-notes') };
  else if (type === 'clients') item = { name: getV('f-name'), company: getV('f-company'), status: getV('f-status'), email: getV('f-email'), phone: getV('f-phone'), address: getV('f-address'), totalRevenue: parseFloat(getV('f-totalRevenue')) || 0, serviceId: getV('f-serviceId'), notes: getV('f-notes') };
  else if (type === 'services') item = { name: getV('f-name'), category: getV('f-category'), price: parseFloat(getV('f-price')) || 0, description: getV('f-description') };
  else if (type === 'cases') item = { title: getV('f-title'), clientId: getV('f-clientId'), priority: getV('f-priority'), status: getV('f-status'), assignedTo: getV('f-assignedTo'), description: getV('f-description') };
  
  if (editId) {
    const i = D[type].findIndex(function(x) { return x.id === editId; });
    if (i !== -1) D[type][i] = Object.assign({}, D[type][i], item);
    notify('✅ Updated');
  } else {
    item.id = Date.now().toString();
    item.createdAt = new Date().toISOString();
    D[type].push(item);
    notify('✅ Added');
  }
  saveKey(type);
  editId = null;
  closeModal();
  render();
}

function editItem(type, id) {
  editId = id;
  const item = D[type].find(function(x) { return x.id === id; });

  const form = document.getElementById('main-form');

  const oldView = view;
  view = type;

  form.innerHTML = '<div style="padding:20px;background:var(--surface);border-radius:8px;margin-bottom:16px;"><div style="font-size:12px;color:var(--ink-3);margin-bottom:4px;">From: client@example.com</div><div style="font-size:18px;font-weight:700;">Subject</div></div><div style="font-size:13px;line-height:1.6;">Email body content here...</div><div class="btn-row"><button type="button" class="btn btn-ghost" onclick="closeModal();composeEmail();">↩️ Reply</button><div><button type="button" class="btn btn-ghost" onclick="closeModal()">Close</button></div></div>';
  form.onsubmit = function(e) { e.preventDefault(); };
  document.getElementById('modal').classList.add('active');
}

function syncEmails() { notify('🔄 Syncing...'); setTimeout(function() { notify('✅ Synced'); }, 1000); }

function connectGmail() {
  if (localStorage.getItem(K.gmail)) {
    if (confirm('Disconnect Gmail?')) {
      localStorage.removeItem(K.gmail);
      document.getElementById('gmail-badge').style.display = 'none';
      notify('✓ Disconnected');
      render();
    }
  } else {
    localStorage.setItem(K.gmail, 'demo-token');
    document.getElementById('gmail-badge').style.display = 'inline-block';
    document.getElementById('gmail-badge').textContent = '3';
    notify('✅ Gmail connected (demo)');
    render();
  }
}

function exportCSV() {
  let csv = 'Type,Name,Amount,Date,Status\n';
  D.invoices.forEach(function(i) { csv += 'Invoice,' + esc(i.number) + ',' + (i.amount || 0) + ',' + (i.due || '') + ',' + (i.status || '') + '\n'; });
  D.expenses.forEach(function(e) { csv += 'Expense,' + esc(e.description) + ',' + (e.amount || 0) + ',' + (e.date || '') + ',' + (e.category || '') + '\n'; });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'work2u-report-' + Date.now() + '.csv';
  a.click();
  notify('📥 CSV downloaded');
}

function openWorkspaceModal() {
  editingId = null;
  const form = document.getElementById('main-form');
  form.onsubmit = function(e) { e.preventDefault(); saveWorkspace(); };
  document.getElementById('modal-title').textContent = 'New Workspace';
  form.innerHTML = '<div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" id="ws-name" placeholder="Workspace" required></div><div class="form-group"><label class="form-label">Color</label><select class="form-select" id="ws-color"><option value="#2563eb">Blue</option><option value="#06b6d4">Cyan</option><option value="#8b5cf6">Purple</option><option value="#ec4899">Pink</option><option value="#10b981">Green</option><option value="#f59e0b">Orange</option></select></div><div class="btn-row"><div></div><div><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Create</button></div></div>';
  document.getElementById('modal').classList.add('active');
}

function saveWorkspace() {
  const name = getV('ws-name');
  const color = getV('ws-color');
  if (!name) return;
  workspaces.push({ id: 'ws-' + Date.now(), name: name, color: color });
  activeWsId = workspaces[workspaces.length - 1].id;
  saveWs();
  loadWsData();
  updateWsUI();
  closeModal();
  render();
  notify('✅ Workspace: ' + name);
}

function toggleWorkspaceDropdown(e) {
  e.stopPropagation();
  if (workspaces.length === 1) {
    openWorkspaceModal();
    return;
  }
  const choice = prompt('Switch to:\n' + workspaces.map(function(w, i) { return (i + 1) + '. ' + w.name; }).join('\n') + '\n\nEnter number:');
  const idx = parseInt(choice) - 1;
  if (workspaces[idx]) {
    activeWsId = workspaces[idx].id;
    saveWs();
    loadWsData();
    updateWsUI();
    render();
    notify('✓ ' + workspaces[idx].name);
  }
}

function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
function getV(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function notify(msg) { const el = document.getElementById('notif'); el.textContent = msg; el.classList.add('show'); setTimeout(function() { el.classList.remove('show'); }, 2500); }

document.querySelectorAll('.modal-overlay').forEach(function(o) {
  // Close on a genuine backdrop click only. The old check fired on any click
  // whose target was the overlay — but selecting text inside a field (e.g.
  // dragging across the "0" in Total Revenue) puts mousedown on the input and
  // mouseup on the backdrop, which makes the click target the overlay and shut
  // the form mid-edit. Require BOTH the press and the release to land on the
  // backdrop itself.
  var pressedOnBackdrop = false;
  o.addEventListener('mousedown', function(e) { pressedOnBackdrop = (e.target === o); });
  o.addEventListener('click', function(e) {
    if (e.target === o && pressedOnBackdrop) closeModal();
    pressedOnBackdrop = false;
  });
});

window.addEventListener('DOMContentLoaded', function() {
  loadTheme();
  getWs();
  loadWsData();
  updateWsUI();
  const surveyContext = applySurveyContextToWorkspace();
  seedWorkspaceFromSurvey(surveyContext);
  handleBillingReturn();
  if (localStorage.getItem(K.gmail)) {
    const b = document.getElementById('gmail-badge');
    if (b) { b.style.display = 'inline-block'; b.textContent = '3'; }
  }
  render();
  setTimeout(function() {
    booting = false;
    render();
  }, 650);
});
</script>
