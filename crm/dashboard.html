<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work2U CRM</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/w2u-favicon.svg">
<link rel="stylesheet" href="/assets/w2u.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

/* --------------------------------------------------------------------------
   Palet dipetakan ke design system dikongsi (/assets/w2u.css).
   Nama pembolehubah dashboard dikekalkan, jadi 219 rujukan var() di bawah
   terus berfungsi tanpa diubah.

   BAIKI: warna jenama dan status dahulunya hidup HANYA di dalam blok
   [data-theme="light"]. Kedua-dua blok tema ialah adik-beradik, jadi
   bertukar ke gelap meninggalkan --primary, --accent, --green, --red, dan
   --amber tidak tertakrif - 78 pengisytiharan kehilangan nilainya. Ia kini
   duduk pada :root kosong, di mana kedua-dua tema mewarisinya.
   -------------------------------------------------------------------------- */

:root {
  --primary:      var(--w2u-accent);
  --primary-dark: var(--w2u-accent-600);
  --accent:       var(--w2u-accent);
  --green:        var(--w2u-success);
  --red:          var(--w2u-danger);
  --amber:        var(--w2u-warning);
}

:root[data-theme="light"] {
  --bg:            var(--w2u-bg-subtle);
  --bg-2:          var(--w2u-bg);
  --surface:       var(--w2u-bg-muted);
  --surface-2:     var(--w2u-n200);
  --border:        var(--w2u-border);
  --border-bright: var(--w2u-border-strong);
  --ink:           var(--w2u-text);
  --ink-2:         var(--w2u-text-muted);
  --ink-3:         var(--w2u-text-subtle);
  --shadow:        var(--w2u-shadow-md);
  --shadow-sm:     var(--w2u-shadow-sm);
}

:root[data-theme="dark"] {
  --bg:            var(--w2u-bg);
  --bg-2:          var(--w2u-bg-subtle);
  --surface:       var(--w2u-surface);
  --surface-2:     var(--w2u-surface-hover);
  --border:        var(--w2u-border);
  --border-bright: var(--w2u-border-strong);
  --ink:           var(--w2u-text);
  --ink-2:         var(--w2u-text-muted);
  --ink-3:         var(--w2u-text-subtle);
  --shadow:        var(--w2u-shadow-md);
  --shadow-sm:     var(--w2u-shadow-sm);
  /* Aksen dicerahkan supaya ia lulus kontras pada permukaan gelap */
  --primary:       var(--w2u-accent-400);
  --primary-dark:  var(--w2u-accent);
}

body {
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.2s, color 0.2s;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 10%, rgba(37, 99, 235, 0.11), transparent 30%),
    radial-gradient(circle at 85% 20%, rgba(6, 182, 212, 0.10), transparent 24%),
    radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.08), transparent 30%);
  z-index: -1;
}

body.loading #main {
  opacity: 0.85;
}

/* Top Bar */
.topbar {
  background: rgba(255, 255, 255, 0.84);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
}
.brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--primary), var(--accent), var(--green));
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 800;
  font-size: 14px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  transform: perspective(400px) rotateY(-10deg);
}
.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.topbar-mobile-channels {
  display: none;
  gap: 6px;
  align-items: center;
}
.channel-mini-btn {
  min-width: 36px;
  height: 36px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}
.channel-mini-btn:hover {
  transform: translateY(-1px);
  color: var(--ink);
  border-color: rgba(37, 99, 235, 0.28);
}
.channel-mini-btn.wa { color: #128c7e; }
.channel-mini-btn.em { color: #2563eb; }
.channel-mini-btn.tg { color: #0ea5e9; }
.icon-btn {
  width: 36px;
  height: 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition: all 0.2s;
  font-family: inherit;
  padding: 0;
  position: relative;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 8px;
  min-width: 16px;
  text-align: center;
}

/* Layout */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: calc(100vh - 61px);
}

/* Sidebar */
.sidebar {
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  overflow-y: auto;
}
.workspace-selector {
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.2s;
  margin-bottom: 16px;
}
.workspace-selector:hover { background: var(--surface); }
.ws-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.ws-info { flex: 1; min-width: 0; }
.ws-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-plan { font-size: 11px; color: var(--ink-3); }
.ws-add {
  width: 24px;
  height: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 14px;
  color: var(--ink-2);
  padding: 0;
}

.nav-section { margin-bottom: 12px; }
.nav-section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  padding: 4px 10px;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 2px;
  font-family: inherit;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  font-weight: 500;
}
.nav-item:hover { background: var(--surface); color: var(--ink); }
.nav-item.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.18);
}
.nav-item .nav-icon {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.nav-item .nav-icon svg {
  width: 16px;
  height: 16px;
}
.nav-item .nav-badge {
  margin-left: auto;
  font-size: 10px;
  padding: 2px 6px;
  background: var(--surface);
  border-radius: 8px;
  color: var(--ink-3);
  font-weight: 600;
}
.nav-item.active .nav-badge { background: rgba(255,255,255,0.2); color: white; }

/* Main */
.main { padding: 24px 28px; overflow-x: auto; }
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.page-sub {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 2px;
}
.page-actions { display: flex; gap: 8px; }

.dashboard-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
  gap: 16px;
  margin-bottom: 18px;
}
.hero-card,
.hero-panel-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.88));
  border: 1px solid rgba(226, 232, 240, 0.92);
  border-radius: 28px;
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.07);
  overflow: hidden;
  position: relative;
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
}
.hero-card {
  padding: 24px;
}
.hero-card::before,
.hero-panel-card::before {
  content: '';
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, rgba(37, 99, 235, 0.92), rgba(6, 182, 212, 0.92), rgba(16, 185, 129, 0.88));
  opacity: 0.85;
}
.hero-card .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary);
  background: rgba(37, 99, 235, 0.08);
  margin-bottom: 14px;
}
.dashboard-title {
  font-size: clamp(32px, 4vw, 48px);
  line-height: 1.05;
  letter-spacing: -0.04em;
  margin-bottom: 10px;
}
.dashboard-copy {
  color: var(--ink-3);
  max-width: 58ch;
  margin-bottom: 18px;
}
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
}
.hero-panel-card {
  padding: 18px;
  display: grid;
  gap: 12px;
}
.hero-exec-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.hero-exec-item {
  padding: 12px 14px;
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(248,250,252,0.92));
  border: 1px solid rgba(226, 232, 240, 0.92);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
  position: relative;
  overflow: hidden;
}
.hero-exec-item::before {
  content: '';
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, rgba(37, 99, 235, 0.9), rgba(6, 182, 212, 0.88), rgba(16, 185, 129, 0.8));
  opacity: 0.72;
}
.hero-exec-item .tiny {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.hero-exec-item strong {
  display: block;
  font-size: 16px;
  margin-top: 6px;
  letter-spacing: -0.02em;
}
.hero-exec-item p {
  margin-top: 3px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-3);
}
.hero-metric-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.metric-card {
  padding: 14px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.92));
  border: 1px solid rgba(226, 232, 240, 0.92);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.04);
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.metric-card:hover {
  transform: translateY(-2px);
  border-color: rgba(37, 99, 235, 0.18);
  box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
}
.metric-card .tiny { font-size: 11px; color: var(--ink-3); }
.metric-card strong { display: block; font-size: 20px; margin-top: 4px; letter-spacing: -0.02em; }
.metric-card .subtle { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.hero-activity {
  border-radius: 20px;
  padding: 14px;
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.09), rgba(6, 182, 212, 0.08), rgba(16, 185, 129, 0.06));
  border: 1px solid rgba(37, 99, 235, 0.12);
}
.hero-activity .tiny { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.hero-activity strong { display:block; margin: 6px 0 2px; }
.hero-activity p { font-size: 12px; color: var(--ink-2); }
.survey-banner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  margin-bottom: 18px;
  padding: 18px 20px;
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.10), rgba(6, 182, 212, 0.10));
  border: 1px solid rgba(37, 99, 235, 0.14);
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.05);
  position: relative;
  overflow: hidden;
}
.survey-banner::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.32), transparent 42%);
  pointer-events: none;
}
.survey-banner .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary);
}
.survey-banner h2 {
  font-size: 18px;
  margin: 6px 0 8px;
  letter-spacing: -0.02em;
}
.survey-banner p {
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 76ch;
}
.survey-banner-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.survey-banner-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--ink-2);
}
.survey-banner-actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  min-width: 180px;
}
.survey-banner-actions .btn {
  justify-content: center;
}
.survey-banner .btn-ghost {
  background: rgba(255,255,255,0.85);
}
.setup-checklist {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 14px;
  margin-bottom: 18px;
}
.checklist-card,
.starter-pack-card {
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.88));
  border: 1px solid var(--border);
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.05);
  padding: 18px;
  position: relative;
  overflow: hidden;
}
.checklist-card::before,
.starter-pack-card::before {
  content: '';
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, rgba(37, 99, 235, 0.9), rgba(6, 182, 212, 0.85));
}
.checklist-card,
.starter-pack-card,
.mini-kpi-card,
.analytics-card,
.stat-card,
.report-card,
.wa-area,
.email-list,
.ai-chat,
.kanban-col,
.expense-widget,
.expense-panel,
.modal {
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.checklist-card:hover,
.starter-pack-card:hover,
.mini-kpi-card:hover,
.analytics-card:hover,
.stat-card:hover,
.report-card:hover,
.wa-area:hover,
.email-list:hover,
.ai-chat:hover,
.kanban-col:hover,
.expense-widget:hover,
.expense-panel:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 38px rgba(15, 23, 42, 0.08);
}
.checklist-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.checklist-head h3,
.starter-pack-card h3 {
  font-size: 18px;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.checklist-head p,
.starter-pack-card p {
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-2);
}
.checklist-list {
  display: grid;
  gap: 10px;
}
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--bg);
  border: 1px solid var(--border);
}
.checklist-item.done {
  background: rgba(16, 185, 129, 0.08);
  border-color: rgba(16, 185, 129, 0.16);
}
.checklist-mark {
  width: 24px;
  height: 24px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 800;
  background: rgba(37, 99, 235, 0.12);
  color: var(--primary);
}
.checklist-item.done .checklist-mark {
  background: rgba(16, 185, 129, 0.18);
  color: var(--green);
}
.checklist-item strong {
  display: block;
  font-size: 13px;
  margin-bottom: 2px;
}
.checklist-item span {
  display: block;
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-3);
}
.checklist-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.checklist-progress {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}
.checklist-progress-bar {
  height: 10px;
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.18);
  overflow: hidden;
}
.checklist-progress-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  transition: width 0.2s ease;
}
.checklist-progress-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 600;
}
.checklist-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.9);
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.checklist-body {
  display: grid;
  gap: 10px;
}
.checklist-card.collapsed .checklist-body {
  display: none;
}
.checklist-card.collapsed .checklist-actions {
  margin-top: 0;
}
.starter-pack-card {
  display: grid;
  gap: 14px;
}
.starter-pack-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.starter-pack-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 999px;
  background: rgba(37, 99, 235, 0.08);
  border: 1px solid rgba(37, 99, 235, 0.12);
  color: var(--ink-2);
  font-size: 12px;
}
.starter-pack-cta {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.starter-pack-cta .btn {
  justify-content: center;
}
.mini-kpi-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.mini-kpi-card {
  padding: 14px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(248,250,252,0.9));
  border: 1px solid var(--border);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
}
.mini-kpi-card .tiny {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.mini-kpi-card strong {
  display: block;
  font-size: 18px;
  margin-top: 6px;
  letter-spacing: -0.02em;
}
.mini-kpi-card p {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 2px;
}
.sparkline {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 4px;
  align-items: end;
  height: 40px;
  margin-top: 10px;
}
.sparkline span {
  border-radius: 999px 999px 6px 6px;
  background: linear-gradient(180deg, rgba(37, 99, 235, 0.18), rgba(37, 99, 235, 0.92));
  min-height: 6px;
}
.sparkline.green span {
  background: linear-gradient(180deg, rgba(16, 185, 129, 0.18), rgba(16, 185, 129, 0.92));
}
.sparkline.amber span {
  background: linear-gradient(180deg, rgba(245, 158, 11, 0.18), rgba(245, 158, 11, 0.92));
}
.stats-bento .stat-card {
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.9));
  box-shadow: 0 16px 40px rgba(15, 23, 42, 0.05);
}
.stats-bento .stat-card-num { font-size: 28px; letter-spacing: -0.03em; }
.analytics-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0 18px;
}
.analytics-card {
  padding: 16px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(248,250,252,0.92));
  border: 1px solid rgba(226, 232, 240, 0.92);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
}
.analytics-card .tiny {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.analytics-card strong {
  display: block;
  font-size: 19px;
  margin-top: 6px;
  letter-spacing: -0.02em;
}
.analytics-card p {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 3px;
}
.panel.soft-surface,
.kanban-col,
.list-card,
.report-card,
.wa-area,
.email-list,
.ai-chat,
.modal {
  border-radius: 20px;
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.05);
}

.skeleton-shell {
  display: grid;
  gap: 16px;
}
.skeleton-row {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.skeleton-card,
.skeleton-line,
.skeleton-pill,
.skeleton-block {
  position: relative;
  overflow: hidden;
  background: rgba(148, 163, 184, 0.15);
}
.skeleton-card,
.skeleton-block {
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 18px;
}
.skeleton-card {
  min-height: 96px;
  padding: 18px;
}
.skeleton-block {
  min-height: 240px;
}
.skeleton-line,
.skeleton-pill {
  border-radius: 999px;
}
.skeleton-line { height: 12px; margin-bottom: 10px; }
.skeleton-line.sm { width: 48%; }
.skeleton-line.md { width: 72%; }
.skeleton-line.lg { width: 92%; }
.skeleton-pill { height: 30px; width: 120px; }
.skeleton-shimmer::after,
.skeleton-card::after,
.skeleton-line::after,
.skeleton-pill::after,
.skeleton-block::after {
  content: '';
  position: absolute;
  inset: 0;
  transform: translateX(-120%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  100% { transform: translateX(120%); }
}

.btn {
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  border: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
.btn-ghost {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--ink-2);
}
.btn-ghost:hover { background: var(--surface); color: var(--ink); }
.btn-danger {
  background: transparent;
  border: 1px solid var(--red);
  color: var(--red);
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.expense-widget {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  margin-top: 18px;
}
.expense-widget-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}
.expense-widget-title { font-size: 18px; font-weight: 700; }
.expense-widget-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 1.5; }
.expense-widget-toolbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}
.expense-month-input {
  min-width: 150px;
  max-width: 170px;
  height: 38px;
}
.expense-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 0.92fr);
  gap: 12px;
  margin-top: 14px;
}
.expense-stack {
  display: grid;
  gap: 12px;
}
.expense-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
}
.expense-panel h3 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
}
.expense-list {
  display: grid;
  gap: 8px;
}
.expense-item {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
}
.expense-item-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.expense-item-title { font-size: 13px; font-weight: 700; }
.expense-item-sub { font-size: 11px; color: var(--ink-3); margin-top: 4px; line-height: 1.45; }
.expense-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  background: rgba(37, 99, 235, 0.10);
  color: var(--primary);
}
.expense-chip.warn { background: rgba(245, 158, 11, 0.14); color: var(--amber); }
.expense-chip.good { background: rgba(16, 185, 129, 0.14); color: var(--green); }
.expense-chip.bad { background: rgba(239, 68, 68, 0.14); color: var(--red); }
.expense-empty-state {
  padding: 18px;
  text-align: center;
  color: var(--ink-3);
  border: 1px dashed var(--border);
  border-radius: 12px;
}
.expense-dashboard-loading {
  display: grid;
  gap: 12px;
}
.expense-dashboard-error {
  padding: 14px;
  border: 1px solid rgba(239, 68, 68, 0.25);
  background: rgba(239, 68, 68, 0.08);
  border-radius: 12px;
  color: var(--red);
  font-size: 13px;
  line-height: 1.5;
}
.stat-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.92));
  border: 1px solid rgba(226, 232, 240, 0.92);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.04);
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  will-change: transform;
}
.stat-card:hover {
  border-color: var(--border-bright);
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
}
.stat-card-label {
  font-size: 11px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}
.stat-card-num {
  font-size: 24px;
  font-weight: 800;
  margin-top: 4px;
  color: var(--ink);
}
.stat-card.positive .stat-card-num { color: var(--green); }
.stat-card.negative .stat-card-num { color: var(--red); }
.stat-card-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.tab {
  padding: 10px 16px;
  background: transparent;
  border: none;
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink-2); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab .count {
  font-size: 10px;
  padding: 2px 6px;
  background: var(--surface);
  border-radius: 8px;
  color: var(--ink-3);
  font-weight: 600;
}
.tab.active .count { background: rgba(37, 99, 235, 0.15); color: var(--primary); }

/* Kanban */
.kanban {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  min-width: 900px;
}
.kanban-col {
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.9));
  border: 1px solid rgba(226, 232, 240, 0.95);
  border-radius: 20px;
  padding: 14px;
  min-height: 400px;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
}
.kanban-col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* --- Drag and drop antara stage --- */
.item-card[draggable="true"] { cursor: grab; }
.item-card.dragging {
  opacity: 0.45;
  cursor: grabbing;
  transform: rotate(1deg);
}
/* Lajur menyala sebagai sasaran lepas semasa kad diseret */
.kanban-col.kanban-col-over {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary) inset, 0 12px 28px rgba(15, 23, 42, 0.08);
}
/* Ruang kosong menjadi zon lepas yang jelas, bukan hanya teks */
.kanban-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 72px;
  padding: 20px;
  border: 1.5px dashed var(--border-bright);
  border-radius: 12px;
  color: var(--ink-3);
  font-size: 11px;
  text-align: center;
}
.kanban-col.kanban-col-over .kanban-empty {
  border-color: var(--primary);
  color: var(--primary);
}
/* Semasa seret aktif, tekankan semua zon lepas supaya sasaran jelas */
body.kanban-dragging .kanban-col,
body.board-dragging .kanban-col { border-style: dashed; }
.kanban-body { min-height: 60px; display: flex; flex-direction: column; gap: 10px; }
.kanban-col.zone-over, .kanban-body.zone-over {
  border-color: var(--primary);
}

/* ==========================================================================
   Board head: view toggle (Table / Board), monday.com style
   ========================================================================== */
.board-head-actions { display: flex; align-items: center; gap: 12px; }
.board-toggle {
  display: inline-flex;
  padding: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.board-toggle-btn {
  border: none;
  background: transparent;
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-3);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.board-toggle-btn.active { background: var(--primary); color: #fff; }

/* ==========================================================================
   monday.com-style grouped table
   ========================================================================== */
.monday-board { display: flex; flex-direction: column; gap: 14px; }
.mb-group { border-radius: 10px; }
.mb-group-head {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px;
  border-left: 3px solid var(--stage, #579bfc);
  border-radius: 5px;
  background: color-mix(in srgb, var(--stage, #579bfc) 9%, var(--surface));
  margin-bottom: 4px;
}
@supports not (background: color-mix(in srgb, red 50%, transparent)) {
  .mb-group-head { background: var(--surface); }
}
.mb-group-name {
  font-size: 12px; font-weight: 700; letter-spacing: -0.01em;
  color: var(--stage, var(--ink));
}
.mb-group-count {
  font-size: 11px; font-weight: 600; color: var(--ink-3);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 0 7px;
}
.mb-rows { display: flex; flex-direction: column; gap: 1px; min-height: 30px; border-radius: 6px; }
.mb-rows.zone-over { outline: 2px dashed var(--primary); outline-offset: 2px; }

.mb-row {
  display: grid;
  grid-template-columns: 16px minmax(140px, 2fr) 118px repeat(3, minmax(76px, 1fr));
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  min-height: 34px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: box-shadow 0.12s, border-color 0.12s;
}
.mb-row:hover { border-color: var(--border-bright); box-shadow: var(--shadow-sm); }
.mb-row.dragging { opacity: 0.45; }
.mb-drag { color: var(--ink-3); cursor: grab; font-size: 11px; letter-spacing: -2px; }
.mb-name { font-size: 12.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-cell { font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-dim { color: var(--ink-3); }
.mb-money { font-weight: 700; color: var(--green); }
.mb-date { color: var(--ink-2); }

/* The colored status pill — the monday.com signature. Click to change stage.
   Kept compact so a row stays ~34px, the way monday's rows read. */
.status-pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  width: 100%;
  border: none;
  padding: 3px 8px;
  min-height: 24px;
  border-radius: 5px;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.01em;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,0.12);
  transition: filter 0.12s;
}
.status-pill:hover { filter: brightness(1.06); }
.status-caret { font-size: 8px; opacity: 0.85; }

.mb-prio { font-weight: 700; text-transform: capitalize; }
.mb-prio-high { color: var(--red); }
.mb-prio-med { color: var(--amber); }
.mb-prio-low { color: var(--ink-3); }
.mb-tag {
  display: inline-block; padding: 1px 7px; border-radius: 20px;
  font-size: 10.5px; font-weight: 600; text-transform: capitalize;
  background: var(--surface); color: var(--ink-2); border: 1px solid var(--border);
}
.mb-empty {
  display: flex; align-items: center; justify-content: center;
  min-height: 30px; padding: 8px;
  border: 1px dashed var(--border-bright); border-radius: 6px;
  color: var(--ink-3); font-size: 11px;
}

/* Inline colored status dropdown */
.stage-menu {
  position: absolute; z-index: 1200;
  min-width: 180px;
  background: var(--bg-2);
  border: 1px solid var(--border-bright);
  border-radius: 10px;
  box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
  padding: 6px;
}
.stage-menu-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  border: none; background: transparent;
  padding: 8px 10px; border-radius: 7px;
  font-size: 13px; font-weight: 600; color: var(--ink);
  cursor: pointer; text-align: left;
}
.stage-menu-item:hover { background: var(--surface); }
.stage-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }

@media (max-width: 720px) {
  .mb-row { grid-template-columns: 18px 1fr auto; }
  .mb-row .mb-cell { display: none; }
  .board-head-actions { flex-wrap: wrap; }
}
.col-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.col-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.col-count {
  font-size: 11px;
  color: var(--ink-3);
  background: var(--bg-2);
  padding: 2px 6px;
  border-radius: 8px;
  font-weight: 600;
}
.add-card-btn {
  width: 100%;
  padding: 8px;
  background: transparent;
  border: 1px dashed var(--border-bright);
  color: var(--ink-3);
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  margin-top: 8px;
}
.add-card-btn:hover { border-color: var(--primary); color: var(--primary); }

.item-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.item-card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.item-card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
.item-card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-3); }
.item-tag {
  display: inline-block;
  padding: 2px 8px;
  background: rgba(37, 99, 235, 0.1);
  color: var(--primary);
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  margin-right: 4px;
}
.item-tag.sales { background: rgba(16, 185, 129, 0.1); color: var(--green); }
.item-tag.marketing { background: rgba(245, 158, 11, 0.1); color: var(--amber); }
.item-tag.design { background: rgba(236, 72, 153, 0.1); color: #ec4899; }
.item-tag.tech { background: rgba(6, 182, 212, 0.1); color: var(--accent); }
.item-tag.ops { background: rgba(100, 116, 139, 0.1); color: var(--ink-2); }

.item-prio {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
}
.item-prio.high { background: rgba(239, 68, 68, 0.15); color: var(--red); }
.item-prio.med { background: rgba(245, 158, 11, 0.15); color: var(--amber); }
.item-prio.low { background: rgba(16, 185, 129, 0.15); color: var(--green); }

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-3);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 14px; margin-bottom: 16px; }

/* List */
.list-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.92));
  border: 1px solid rgba(226, 232, 240, 0.95);
  border-radius: 16px;
  padding: 14px 15px;
  margin-bottom: 10px;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.list-card:hover {
  transform: translateY(-2px);
  border-color: rgba(37, 99, 235, 0.22);
  box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
}
.list-card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.list-card-title { font-size: 14px; font-weight: 600; flex: 1; }
.list-card-info { font-size: 12px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; }
.list-card-amount { font-size: 14px; font-weight: 700; color: var(--green); }
.list-card-amount.due { color: var(--amber); }
.list-card-amount.overdue { color: var(--red); }
.list-card-amount.expense { color: var(--red); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  z-index: 1000;
  place-items: center;
  padding: 24px;
}
.modal-overlay.active { display: grid; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-2);
  border-radius: 16px;
  padding: 24px;
  max-width: 540px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; letter-spacing: 0.03em; text-transform: uppercase; }
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--ink);
  font-size: 13px;
  font-family: inherit;
  transition: all 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.form-textarea { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.btn-row { display: flex; gap: 8px; justify-content: space-between; margin-top: 16px; }
.btn-row > div:last-child { display: flex; gap: 8px; }

/* Notif */
.notif {
  position: fixed;
  top: 76px;
  right: 20px;
  background: var(--bg-2);
  border: 1px solid var(--primary);
  border-radius: 10px;
  padding: 12px 18px;
  color: var(--ink);
  font-size: 13px;
  z-index: 2000;
  display: none;
  box-shadow: var(--shadow);
}
.notif.show { display: block; animation: slideIn 0.3s; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Calendar */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.cal-day-header {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-3);
  text-align: center;
  padding: 6px;
  text-transform: uppercase;
}
.cal-day {
  aspect-ratio: 1;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cal-day.today { border-color: var(--primary); background: rgba(37, 99, 235, 0.08); }
.cal-day-num { font-size: 11px; font-weight: 600; }
.cal-event {
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--primary);
  color: white;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-event-muted {
  background: rgba(148, 163, 184, 0.18);
  color: var(--ink-2);
  white-space: normal;
  line-height: 1.35;
}
.cal-event-btn {
  width: 100%;
  border: 0;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.calendar-toolbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 14px 0 14px;
}
.calendar-toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.calendar-view-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.calendar-view-btn.active {
  background: rgba(37, 99, 235, 0.12);
  border-color: rgba(37, 99, 235, 0.18);
  color: var(--primary);
}
.calendar-filter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 600;
}
.calendar-filter span {
  white-space: nowrap;
}
.calendar-select {
  min-width: 170px;
  height: 36px;
}
.calendar-mini-label {
  display: inline-flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.85);
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 600;
}
.calendar-month-grid {
  margin-top: 0;
}
.calendar-week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}
.calendar-week-day {
  min-height: 200px;
  padding: 10px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.calendar-week-day.today {
  border-color: rgba(37, 99, 235, 0.32);
  background: rgba(37, 99, 235, 0.05);
}
.calendar-week-day-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.calendar-week-day-head > div:first-child {
  display: grid;
  gap: 2px;
}
.calendar-week-day-head strong {
  font-size: 12px;
  font-weight: 800;
}
.calendar-week-day-head span {
  font-size: 11px;
  color: var(--ink-3);
}
.calendar-week-day-summary {
  font-size: 11px;
  line-height: 1.4;
  color: var(--ink-3);
  text-align: right;
  max-width: 52%;
}
.calendar-week-items {
  display: grid;
  gap: 6px;
}
.calendar-more,
.calendar-empty-day {
  font-size: 11px;
  color: var(--ink-3);
}
.calendar-event-card {
  text-align: left;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-2);
  width: 100%;
}

/* Reports */
.report-row { display: flex; gap: 14px; margin-bottom: 14px; }
.report-card {
  flex: 1;
  background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.94));
  border: 1px solid rgba(226, 232, 240, 0.95);
  border-radius: 22px;
  padding: 18px;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.report-card:hover {
  transform: translateY(-2px);
  border-color: rgba(37, 99, 235, 0.22);
  box-shadow: 0 16px 34px rgba(15, 23, 42, 0.09);
}
.report-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--ink-2); }
.report-card .big-num {
  font-size: 24px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.report-exec-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 14px 0 18px;
}
.report-exec-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.9));
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 12px 26px rgba(15, 23, 42, 0.04);
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.report-exec-card:hover {
  transform: translateY(-2px);
  border-color: rgba(37, 99, 235, 0.18);
  box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
}
.report-exec-card strong {
  display: block;
  margin-top: 4px;
  font-size: 16px;
  letter-spacing: -0.02em;
}
.report-exec-bars {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}
.report-exec-bar-row {
  display: grid;
  gap: 6px;
}
.report-exec-bar-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  font-size: 12px;
}
.report-exec-bar-meta span {
  color: var(--ink-2);
  font-weight: 600;
}
.report-exec-bar-meta strong {
  font-size: 12px;
  margin-top: 0;
  color: var(--ink);
}
.report-exec-bar-track {
  height: 10px;
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.16);
  overflow: hidden;
}
.report-exec-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
}
.report-exec-bar-fill.good { background: linear-gradient(135deg, #10b981, #06b6d4); }
.report-exec-bar-fill.warn { background: linear-gradient(135deg, #f59e0b, #f97316); }
.report-exec-bar-fill.bad { background: linear-gradient(135deg, #ef4444, #f43f5e); }
.report-exec-metrics {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.report-exec-chip {
  flex: 1 1 120px;
  min-width: 120px;
  border-radius: 14px;
  padding: 10px 12px;
  background: rgba(15, 23, 42, 0.03);
  border: 1px solid rgba(148, 163, 184, 0.18);
}
.report-exec-chip span {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-2);
}
.report-exec-chip strong {
  display: block;
  margin-top: 4px;
  font-size: 14px;
  letter-spacing: -0.02em;
}
.mobile-bottom-bar {
  display: none;
}
.mobile-bottom-bar-shell {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  padding: 8px;
  border-radius: 22px;
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.28), inset 0 1px 0 rgba(255,255,255,0.04);
}
.mobile-bottom-btn {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 9px 6px;
  border-radius: 16px;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(255,255,255,0.78);
  font-family: inherit;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  will-change: transform;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
}
.mobile-bottom-btn:active {
  transform: translateY(-0.5px) scale(0.985);
  box-shadow: 0 8px 16px rgba(15, 23, 42, 0.18);
}
.mobile-bottom-btn.pressed {
  animation: mobileTap 0.18s ease;
}
.mobile-bottom-btn svg {
  width: 17px;
  height: 17px;
  transition: transform 0.2s ease, filter 0.2s ease;
}
.mobile-bottom-btn span {
  line-height: 1;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.mobile-bottom-btn.active,
.mobile-bottom-btn:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.12);
  color: #fff;
}
.mobile-bottom-btn.active {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 12px 24px rgba(15, 23, 42, 0.24);
}
.mobile-bottom-btn.active::before {
  content: '';
  position: absolute;
  top: 6px;
  left: 50%;
  width: 24px;
  height: 3px;
  border-radius: 999px;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 0 14px rgba(255, 255, 255, 0.28);
}
.mobile-bottom-btn.active svg {
  transform: translateY(-1px) scale(1.05);
  filter: drop-shadow(0 6px 10px rgba(255, 255, 255, 0.12));
}
.mobile-bottom-btn.active span {
  transform: translateY(-1px);
  opacity: 1;
}
.mobile-bottom-btn.primary {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
}
.mobile-bottom-btn.primary.active {
  background: linear-gradient(135deg, #1d4ed8, #0891b2);
  box-shadow: 0 14px 28px rgba(37, 99, 235, 0.34);
}
.mobile-bottom-btn[data-mobile-action="dashboard"].active {
  background: linear-gradient(135deg, rgba(30, 64, 175, 0.98), rgba(37, 99, 235, 0.9));
  box-shadow: 0 14px 28px rgba(37, 99, 235, 0.32);
}
.mobile-bottom-btn[data-mobile-action="ai"].active {
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.98), rgba(168, 85, 247, 0.9));
  box-shadow: 0 14px 28px rgba(99, 102, 241, 0.3);
}
.mobile-bottom-btn[data-mobile-action="email"].active {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.96), rgba(14, 165, 233, 0.9));
  box-shadow: 0 14px 28px rgba(59, 130, 246, 0.34);
}
.mobile-bottom-btn[data-mobile-action="reports"].active {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.96), rgba(20, 184, 166, 0.9));
  box-shadow: 0 14px 28px rgba(16, 185, 129, 0.28);
}
.mobile-bottom-btn[data-mobile-action="email"].active::before,
.mobile-bottom-btn[data-mobile-action="reports"].active::before,
.mobile-bottom-btn[data-mobile-action="dashboard"].active::before,
.mobile-bottom-btn[data-mobile-action="ai"].active::before {
  top: 5px;
  width: 28px;
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.36);
}
.mobile-bottom-btn[data-mobile-action="email"].active svg,
.mobile-bottom-btn[data-mobile-action="reports"].active svg,
.mobile-bottom-btn[data-mobile-action="dashboard"].active svg,
.mobile-bottom-btn[data-mobile-action="ai"].active svg {
  filter: drop-shadow(0 6px 10px rgba(255, 255, 255, 0.16));
}
@keyframes mobileTap {
  0% { transform: translateY(0) scale(1); }
  45% { transform: translateY(0.5px) scale(0.98); }
  100% { transform: translateY(0) scale(1); }
}
.report-exec-note {
  margin-top: 10px;
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1.5;
}

/* WhatsApp QR */
.wa-area {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  display: flex;
  gap: 24px;
  align-items: center;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.wa-area:hover {
  transform: translateY(-2px);
  border-color: rgba(37, 99, 235, 0.18);
  box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
}
.wa-qr {
  width: 200px;
  height: 200px;
  background: white;
  border-radius: 12px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
}
.wa-qr-text { font-family: monospace; font-size: 12px; padding: 16px; text-align: center; color: var(--ink-2); }

/* Email */
.email-list {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.email-list:hover {
  transform: translateY(-2px);
  border-color: rgba(37, 99, 235, 0.16);
  box-shadow: 0 14px 30px rgba(15, 23, 42, 0.05);
}
.email-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease;
}
.email-row:last-child { border-bottom: none; }
.email-row:hover { background: var(--surface); transform: translateX(2px); }
.email-row.unread { font-weight: 600; }
.email-from { width: 180px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.email-subject { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.email-date { font-size: 11px; color: var(--ink-3); width: 80px; text-align: right; }

/* AI chat */
.ai-chat {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  height: 500px;
  display: flex;
  flex-direction: column;
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.ai-chat:hover {
  transform: translateY(-2px);
  border-color: rgba(37, 99, 235, 0.18);
  box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
}
.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  margin-bottom: 12px;
}
.ai-msg {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  max-width: 85%;
}
.ai-msg.user {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  margin-left: auto;
}
.ai-msg.assistant {
  background: var(--surface);
  color: var(--ink);
}
.ai-input-row { display: flex; gap: 8px; }
.ai-input-row .form-input { flex: 1; }


/* WhatsApp Styles */
.wa-container {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 14px;
  height: calc(100vh - 200px);
  min-height: 500px;
}
.wa-sidebar {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.wa-search {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}
.wa-search input {
  width: 100%;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--ink);
  font-family: inherit;
}
.wa-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.wa-tab {
  flex: 1;
  padding: 10px;
  background: none;
  border: none;
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-family: inherit;
}
.wa-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.wa-list {
  flex: 1;
  overflow-y: auto;
}
.wa-contact {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.2s;
  display: flex;
  gap: 10px;
  align-items: center;
}
.wa-contact:hover { background: var(--surface); }
.wa-contact.active { background: rgba(37, 99, 235, 0.08); }
.wa-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.wa-contact-info { flex: 1; min-width: 0; }
.wa-contact-name { font-size: 13px; font-weight: 600; }
.wa-contact-preview { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.wa-badge {
  background: var(--primary);
  color: white;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 700;
}

.wa-chat {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.wa-chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.wa-chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  background:
    radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.03), transparent 50%);
}
.wa-msg {
  margin-bottom: 8px;
  max-width: 70%;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.4;
  word-wrap: break-word;
}
.wa-msg.in {
  background: var(--surface);
  margin-right: auto;
  border-bottom-left-radius: 2px;
}
.wa-msg.out {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 2px;
}
.wa-msg-time {
  font-size: 10px;
  opacity: 0.7;
  margin-top: 4px;
}
.wa-chat-input {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.wa-chat-input input {
  flex: 1;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  color: var(--ink);
  font-family: inherit;
}
.wa-chat-input input:focus {
  outline: none;
  border-color: var(--primary);
}

.wa-status-card {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.wa-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
  animation: pulse 2s ease-in-out infinite;
}
.wa-status-dot.offline { background: var(--ink-3); box-shadow: none; animation: none; }
.wa-qr-box {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  display: grid;
  place-items: center;
  min-height: 240px;
}


@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 16px; }
  .page-header {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    margin-bottom: 16px;
  }
  .page-actions {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .page-actions .btn {
    flex: 0 0 auto;
  }
  .dashboard-hero,
  .skeleton-row { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat-card { padding: 14px; }
  .stat-card-num { font-size: 21px; }
  .hero-exec-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .topbar { padding: 10px 12px; gap: 10px; }
  .topbar-actions { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

<script>
const K = {
  tasks: 'work2u-tasks',
  leads: 'work2u-leads',
  clients: 'work2u-clients',
  services: 'work2u-services',
  cases: 'work2u-cases',
  invoices: 'work2u-invoices',
  expenses: 'work2u-expenses',
  payments: 'work2u-payments',
  receipts: 'work2u-receipts',
  quotes: 'work2u-quotes',
  channels: 'work2u-channels',
  calendarEvents: 'work2u-calendar-events',
  theme: 'work2u-theme',
  gmail: 'work2u-gmail',
  shares: 'work2u-shares',
  aiHistory: 'work2u-ai-history',
  billingState: 'work2u-billing-state',
  checklistCollapsed: 'work2u-checklist-collapsed',
  checklistCompleted: 'work2u-checklist-completed',
  calendarViewMode: 'work2u-calendar-view-mode',
  calendarTypeFilter: 'work2u-calendar-type-filter',
  calendarChannelFilter: 'work2u-calendar-channel-filter',
  surveyResult: 'work2uSurveyResult',
  ws: 'work2u-workspaces',
  wsActive: 'work2u-ws-active'
};

const D = {
  tasks: load(K.tasks),
  leads: load(K.leads),
  clients: load(K.clients),
  services: load(K.services),
  cases: load(K.cases),
  invoices: load(K.invoices),
  expenses: load(K.expenses),
  payments: load(K.payments),
  receipts: load(K.receipts),
  quotes: load(K.quotes),
  channels: load(K.channels),
  calendarEvents: load(K.calendarEvents)
};

let view = 'dashboard';
let editId = null;
let currentTab = 'all';
let booting = true;
let workspaces = load(K.ws) || [];
let activeWsId = localStorage.getItem(K.wsActive);
let expenseDashboardState = { requestId: 0, loading: false, error: '', data: null, selectedReceiptIds: new Set() };
const EXPENSE_MONTH_KEY = 'work2u-expense-month';

function load(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } }
function save(key) { localStorage.setItem(key, JSON.stringify(D[key])); }
function wsKey(key) { return 'work2u-' + activeWsId + '-' + key; }

function getWs() {
  if (workspaces.length === 0) {
    const def = { id: 'ws-' + Date.now(), name: 'Workspace', color: '#2563eb', plan: 'Starter' };
    workspaces = [def];
    activeWsId = def.id;
    saveWs();
  }
  if (!activeWsId || !workspaces.find(function(w) { return w.id === activeWsId; })) {
    activeWsId = workspaces[0].id;
    saveWs();
  }
  return workspaces.find(function(w) { return w.id === activeWsId; });
}

function saveWs() {
  localStorage.setItem(K.ws, JSON.stringify(workspaces));
  localStorage.setItem(K.wsActive, activeWsId);
}

/* Generate an id that stays unique even when backfilling a whole list in one
 * tick (Date.now() alone would collide). */
function newItemId(i) {
  return 'it-' + Date.now().toString(36) + '-' + (i || 0) + '-' + Math.floor(Math.random() * 1e9).toString(36);
}

/* Seeded starter items were pushed without ids, so editing and drag-and-drop
 * could not identify them. Backfill any item missing an id, and report whether
 * anything changed so the caller can persist it. */
function ensureItemIds(key) {
  const list = D[key];
  if (!Array.isArray(list)) return false;
  let changed = false;
  list.forEach(function(item, i) {
    if (item && typeof item === 'object' && !item.id) {
      item.id = newItemId(i);
      changed = true;
    }
  });
  return changed;
}

function loadWsData() {
  Object.keys(D).forEach(function(key) {
    D[key] = load(wsKey(key));
  });
  // calendarEvents has its own id normalization below; every other collection
  // gets ids backfilled here so cards are always identifiable.
  Object.keys(D).forEach(function(key) {
    if (key === 'calendarEvents') return;
    if (ensureItemIds(key)) saveKey(key);
  });
  const normalizedCalendar = (Array.isArray(D.calendarEvents) ? D.calendarEvents : []).map(function(event, index) {
    return normalizeCalendarEvent(event, index);
  });
  const hadCalendarIdMismatch = normalizedCalendar.some(function(event, index) {
    const original = (Array.isArray(D.calendarEvents) ? D.calendarEvents[index] : null) || {};
    return !original.id || original.id !== event.id;
  });
  D.calendarEvents = normalizedCalendar;
  if (hadCalendarIdMismatch) {
    saveKey('calendarEvents');
  }
}

function saveKey(key) {
  localStorage.setItem(wsKey(key), JSON.stringify(D[key]));
}

function updateWsUI() {
  const ws = getWs();
  const icon = document.getElementById('ws-icon');
  const name = document.getElementById('ws-name');
  const plan = document.getElementById('ws-plan');
  if (icon) { icon.style.background = 'linear-gradient(135deg, ' + ws.color + ', ' + ws.color + '99)'; icon.textContent = ws.name.charAt(0).toUpperCase(); }
  if (name) name.textContent = ws.name;
  if (plan) plan.textContent = ws.plan || 'Starter';
}

function normalizePlanLabel(planCode) {
  const raw = String(planCode || 'Starter').trim();
  if (!raw) return 'Starter';
  return raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
}

function loadSurveyContext() {
  try {
    return JSON.parse(localStorage.getItem(K.surveyResult) || 'null');
  } catch (error) {
    return null;
  }
}

function dismissSurveyBanner() {
  sessionStorage.setItem('work2u-survey-banner-dismissed', '1');
  render();
}

function isChecklistCollapsed() {
  return localStorage.getItem(K.checklistCollapsed) === '1';
}

function setChecklistCollapsed(next) {
  localStorage.setItem(K.checklistCollapsed, next ? '1' : '0');
  render();
}

function toggleChecklistCollapsed() {
  setChecklistCollapsed(!isChecklistCollapsed());
}

function getChecklistState(items) {
  const list = Array.isArray(items) ? items : [];
  const completedCount = list.filter(function(item) { return !!item.done; }).length;
  const totalCount = list.length;
  const progress = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;
  if (progress >= 100) {
    localStorage.setItem(K.checklistCompleted, '1');
  } else {
    localStorage.removeItem(K.checklistCompleted);
  }
  return {
    items: list,
    completedCount: completedCount,
    totalCount: totalCount,
    progress: progress,
    completed: progress >= 100
  };
}

function normalizeCalendarEvent(event, index) {
  const base = event && typeof event === 'object' ? event : {};
  const safeIndex = Number.isFinite(index) ? index : 0;
  const id = String(base.id || base.calendarEventId || 'cal-' + Date.now() + '-' + safeIndex);
  return {
    id: id,
    date: String(base.date || '').trim(),
    title: String(base.title || base.name || 'Calendar event').trim(),
    type: String(base.type || 'task').trim(),
    channel: String(base.channel || '').trim(),
    source: String(base.source || 'manual').trim(),
    notes: String(base.notes || '').trim(),

function applySurveyContextToWorkspace() {
  const context = loadSurveyContext();
  const query = new URLSearchParams(window.location.search);
  const planFromQuery = query.get('plan');
  const surveyFlag = query.get('survey') === '1';
  const recommendation = context && context.recommendation ? context.recommendation : {};
  const survey = context && context.survey ? context.survey : {};
  const ws = getWs();
  let changed = false;

  if (context || surveyFlag || planFromQuery) {
    const plan = normalizePlanLabel(planFromQuery || recommendation.planCode || ws.plan || 'Starter');
    if (plan && ws.plan !== plan) {
      ws.plan = plan;
      changed = true;
    }
    if (survey.role && ws.persona !== survey.role) {
      ws.persona = survey.role;
      changed = true;
    }
    if (survey.mainChannel && ws.primaryChannel !== survey.mainChannel) {
      ws.primaryChannel = survey.mainChannel;
      changed = true;
    }
    if (survey.aiMode && ws.aiMode !== survey.aiMode) {
      ws.aiMode = survey.aiMode;
      changed = true;
    }
    if (survey.region && ws.region !== survey.region) {
      ws.region = survey.region;
      changed = true;
    }
    if (survey.language && ws.language !== survey.language) {
      ws.language = survey.language;
      changed = true;
    }
    if (survey.goal && ws.primaryGoal !== survey.goal) {
      ws.primaryGoal = survey.goal;
      changed = true;
    }
    if (changed) saveWs();
    updateWsUI();
  }

  return {
    hasSurvey: Boolean(context || surveyFlag || planFromQuery),
    surveyFlag,
    recommendation,
    survey
  };
}

function seedWorkspaceFromSurvey(context) {
  const ws = getWs();
  const recommendation = context && context.recommendation ? context.recommendation : {};
  const survey = context && context.survey ? context.survey : {};
  if (!survey || ws.surveySeedApplied || !isWorkspaceEmpty()) return false;

  const pack = buildWorkspaceStarterPack(context);
  if (!pack) return false;

  if (pack.tasks.length) D.tasks.push(...pack.tasks);
  if (pack.leads.length) D.leads.push(...pack.leads);
  if (pack.services.length) D.services.push(...pack.services);
  if (pack.clients.length) D.clients.push(...pack.clients);
  if (pack.invoices.length) D.invoices.push(...pack.invoices);
  if (pack.cases.length) D.cases.push(...pack.cases);
  if (pack.calendarEvents.length) D.calendarEvents.push(...pack.calendarEvents);

  // Seeding runs after loadWsData's id backfill, so give these fresh items
  // ids too — otherwise seeded cards cannot be edited or dragged.
  ['tasks', 'leads', 'services', 'clients', 'invoices', 'cases'].forEach(ensureItemIds);

  saveKey('tasks');
  saveKey('leads');
  saveKey('services');
  saveKey('clients');
  saveKey('invoices');
  saveKey('cases');
  saveKey('calendarEvents');

  ws.surveySeedApplied = recommendation.planCode || 'Starter';
  ws.surveySeededAt = new Date().toISOString();
  ws.plan = normalizePlanLabel(recommendation.planCode || ws.plan || 'Starter');
  if (survey.mainChannel) ws.primaryChannel = survey.mainChannel;
  if (survey.aiMode) ws.aiMode = survey.aiMode;
  if (survey.region) ws.region = survey.region;
  if (survey.language) ws.language = survey.language;
  if (survey.goal) ws.primaryGoal = survey.goal;
  saveWs();
  updateWsUI();
  return true;
}

function buildSetupChecklist(context) {

async function startWorkspaceTrial() {
  const context = loadSurveyContext();
  const recommendation = context && context.recommendation ? context.recommendation : {};
  const survey = context && context.survey ? context.survey : {};
  const ws = getWs();
  const plan = normalizePlanLabel(recommendation.planCode || ws.plan || 'Starter');
  const region = String(survey.region || ws.region || 'Malaysia');
  const provider = region.toLowerCase().includes('malaysia') ? 'billplz' : 'stripe';

  if (plan === 'Enterprise') {
    window.location.href = 'mailto:enquiry@work2u.io?subject=' + encodeURIComponent('Work2U Enterprise onboarding');
    return;
  }

  let email = String(survey.email || '').trim();
  if (!email) {
    email = prompt('Enter the billing email to start the trial:') || '';
  }
  if (!email) {
    notify('⚠️ Billing email is required to start the trial');
    return;
  }

  saveBillingState({
    status: 'initiated',
    provider: provider,
    plan: plan,
    region: region,
    email: email,
    workspaceName: ws.name,
    startedAt: new Date().toISOString()
  });

  try {
    const response = await fetch('/api/billing/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        plan: plan,
        region: region,
        provider: provider,
        email: email,
        name: ws.name,
        workspaceName: ws.name
      })
    });
    const data = await response.json().catch(function() { return {}; });
    if (!response.ok || data.error) {
      throw new Error(data.error || 'Unable to start billing');
    }
    const paymentUrl = data.paymentUrl || data.checkoutUrl || data.url;
    if (paymentUrl) {
      window.location.href = paymentUrl;
      return;
    }
    throw new Error('Billing link is missing');
  } catch (error) {
    notify('⚠️ ' + (error.message || 'Unable to start trial'));
  }
}

function toggleTheme() {
  const c = document.documentElement.getAttribute('data-theme');
  const n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem(K.theme, n);
}

function loadTheme() {
  const t = localStorage.getItem(K.theme) || 'light';
  document.documentElement.setAttribute('data-theme', t);
}

function switchView(v) {
  view = v;
  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.classList.toggle('active', item.dataset.view === v);

  currentTab = 'all';
  syncMobileBottomBar();
  render();

function miniKpiCard(title, value, sub, bars, tone) {
  const series = Array.isArray(bars) && bars.length ? bars : [1];
  const max = Math.max(...series.map(function(item) { return Number(item) || 0; }), 1);
  const sparkClass = tone === 'green' ? 'sparkline green' : tone === 'amber' ? 'sparkline amber' : 'sparkline';
  return '<div class="mini-kpi-card">' +
    '<div class="tiny">' + esc(title) + '</div>' +
    '<strong>' + esc(value) + '</strong>' +
    '<p>' + esc(sub) + '</p>' +
    '<div class="' + sparkClass + '" style="grid-template-columns: repeat(' + series.length + ', minmax(0, 1fr));">' +
      series.map(function(item) {
        const height = Math.max(12, Math.round(((Number(item) || 0) / max) * 100));
        return '<span style="height:' + height + '%"></span>';
      }).join('') +
    '</div>' +
  '</div>';
}
