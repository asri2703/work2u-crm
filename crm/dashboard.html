<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work2U CRM</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

:root[data-theme="light"] {
  --bg: #f8fafc;
  --bg-2: #ffffff;
  --surface: #f1f5f9;
  --surface-2: #e2e8f0;
  --border: #e2e8f0;
  --border-bright: #cbd5e1;
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --accent: #06b6d4;
  --green: #10b981;
  --red: #ef4444;
  --amber: #f59e0b;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
}

:root[data-theme="dark"] {
  --bg: #0a0f1c;
  --bg-2: #111827;
  --surface: #1f2937;
  --surface-2: #374151;
  --border: #1f2937;
  --border-bright: #374151;
  --ink: #f8fafc;
  --ink-2: #cbd5e1;
  --ink-3: #94a3b8;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
}

body {
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.2s, color 0.2s;
}

/* Top Bar */
.topbar {
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
}
.brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 800;
  font-size: 14px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  transform: perspective(400px) rotateY(-10deg);
}
.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.icon-btn {
  width: 36px;
  height: 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition: all 0.2s;
  font-family: inherit;
  padding: 0;
  position: relative;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 8px;
  min-width: 16px;
  text-align: center;
}

/* Layout */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: calc(100vh - 61px);
}

/* Sidebar */
.sidebar {
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  overflow-y: auto;
}
.workspace-selector {
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.2s;
  margin-bottom: 16px;
}
.workspace-selector:hover { background: var(--surface); }
.ws-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.ws-info { flex: 1; min-width: 0; }
.ws-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-plan { font-size: 11px; color: var(--ink-3); }
.ws-add {
  width: 24px;
  height: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 14px;
  color: var(--ink-2);
  padding: 0;
}

.nav-section { margin-bottom: 12px; }
.nav-section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  padding: 4px 10px;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 2px;
  font-family: inherit;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  font-weight: 500;
}
.nav-item:hover { background: var(--surface); color: var(--ink); }
.nav-item.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
}
.nav-item .nav-icon {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.nav-item .nav-icon svg {
  width: 16px;
  height: 16px;
}
.nav-item .nav-badge {
  margin-left: auto;
  font-size: 10px;
  padding: 2px 6px;
  background: var(--surface);
  border-radius: 8px;
  color: var(--ink-3);
  font-weight: 600;
}
.nav-item.active .nav-badge { background: rgba(255,255,255,0.2); color: white; }

/* Main */
.main { padding: 24px 28px; overflow-x: auto; }
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.page-sub {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 2px;
}
.page-actions { display: flex; gap: 8px; }

.btn {
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  border: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
.btn-ghost {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--ink-2);
}
.btn-ghost:hover { background: var(--surface); color: var(--ink); }
.btn-danger {
  background: transparent;
  border: 1px solid var(--red);
  color: var(--red);
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  transition: all 0.2s;
}
.stat-card:hover { border-color: var(--border-bright); }
.stat-card-label {
  font-size: 11px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}
.stat-card-num {
  font-size: 24px;
  font-weight: 800;
  margin-top: 4px;
  color: var(--ink);
}
.stat-card.positive .stat-card-num { color: var(--green); }
.stat-card.negative .stat-card-num { color: var(--red); }
.stat-card-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.tab {
  padding: 10px 16px;
  background: transparent;
  border: none;
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink-2); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab .count {
  font-size: 10px;
  padding: 2px 6px;
  background: var(--surface);
  border-radius: 8px;
  color: var(--ink-3);
  font-weight: 600;
}
.tab.active .count { background: rgba(37, 99, 235, 0.15); color: var(--primary); }

/* Kanban */
.kanban {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  min-width: 900px;
}
.kanban-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  min-height: 400px;
}
.kanban-col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.col-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.col-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.col-count {
  font-size: 11px;
  color: var(--ink-3);
  background: var(--bg-2);
  padding: 2px 6px;
  border-radius: 8px;
  font-weight: 600;
}
.add-card-btn {
  width: 100%;
  padding: 8px;
  background: transparent;
  border: 1px dashed var(--border-bright);
  color: var(--ink-3);
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  margin-top: 8px;
}
.add-card-btn:hover { border-color: var(--primary); color: var(--primary); }

.item-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.item-card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.item-card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
.item-card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-3); }
.item-tag {
  display: inline-block;
  padding: 2px 8px;
  background: rgba(37, 99, 235, 0.1);
  color: var(--primary);
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  margin-right: 4px;
}
.item-tag.sales { background: rgba(16, 185, 129, 0.1); color: var(--green); }
.item-tag.marketing { background: rgba(245, 158, 11, 0.1); color: var(--amber); }
.item-tag.design { background: rgba(236, 72, 153, 0.1); color: #ec4899; }
.item-tag.tech { background: rgba(6, 182, 212, 0.1); color: var(--accent); }
.item-tag.ops { background: rgba(100, 116, 139, 0.1); color: var(--ink-2); }

.item-prio {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
}
.item-prio.high { background: rgba(239, 68, 68, 0.15); color: var(--red); }
.item-prio.med { background: rgba(245, 158, 11, 0.15); color: var(--amber); }
.item-prio.low { background: rgba(16, 185, 129, 0.15); color: var(--green); }

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-3);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 14px; margin-bottom: 16px; }

/* List */
.list-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.list-card:hover { border-color: var(--primary); }
.list-card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.list-card-title { font-size: 14px; font-weight: 600; flex: 1; }
.list-card-info { font-size: 12px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; }
.list-card-amount { font-size: 14px; font-weight: 700; color: var(--green); }
.list-card-amount.due { color: var(--amber); }
.list-card-amount.overdue { color: var(--red); }
.list-card-amount.expense { color: var(--red); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  z-index: 1000;
  place-items: center;
  padding: 24px;
}
.modal-overlay.active { display: grid; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-2);
  border-radius: 16px;
  padding: 24px;
  max-width: 540px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; letter-spacing: 0.03em; text-transform: uppercase; }
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--ink);
  font-size: 13px;
  font-family: inherit;
  transition: all 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.form-textarea { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.btn-row { display: flex; gap: 8px; justify-content: space-between; margin-top: 16px; }
.btn-row > div:last-child { display: flex; gap: 8px; }

/* Notif */
.notif {
  position: fixed;
  top: 76px;
  right: 20px;
  background: var(--bg-2);
  border: 1px solid var(--primary);
  border-radius: 10px;
  padding: 12px 18px;
  color: var(--ink);
  font-size: 13px;
  z-index: 2000;
  display: none;
  box-shadow: var(--shadow);
}
.notif.show { display: block; animation: slideIn 0.3s; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Calendar */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.cal-day-header {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-3);
  text-align: center;
  padding: 6px;
  text-transform: uppercase;
}
.cal-day {
  aspect-ratio: 1;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cal-day.today { border-color: var(--primary); background: rgba(37, 99, 235, 0.08); }
.cal-day-num { font-size: 11px; font-weight: 600; }
.cal-event {
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--primary);
  color: white;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Reports */
.report-row { display: flex; gap: 14px; margin-bottom: 14px; }
.report-card {
  flex: 1;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.report-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--ink-2); }
.report-card .big-num {
  font-size: 24px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* WhatsApp QR */
.wa-area {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  display: flex;
  gap: 24px;
  align-items: center;
}
.wa-qr {
  width: 200px;
  height: 200px;
  background: white;
  border-radius: 12px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
}
.wa-qr-text { font-family: monospace; font-size: 12px; padding: 16px; text-align: center; color: var(--ink-2); }

/* Email */
.email-list {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.email-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.email-row:last-child { border-bottom: none; }
.email-row:hover { background: var(--surface); }
.email-row.unread { font-weight: 600; }
.email-from { width: 180px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.email-subject { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.email-date { font-size: 11px; color: var(--ink-3); width: 80px; text-align: right; }

/* AI chat */
.ai-chat {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  height: 500px;
  display: flex;
  flex-direction: column;
}
.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  margin-bottom: 12px;
}
.ai-msg {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  max-width: 85%;
}
.ai-msg.user {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  margin-left: auto;
}
.ai-msg.assistant {
  background: var(--surface);
  color: var(--ink);
}
.ai-input-row { display: flex; gap: 8px; }
.ai-input-row .form-input { flex: 1; }


/* WhatsApp Styles */
.wa-container {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 14px;
  height: calc(100vh - 200px);
  min-height: 500px;
}
.wa-sidebar {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.wa-search {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}
.wa-search input {
  width: 100%;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--ink);
  font-family: inherit;
}
.wa-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.wa-tab {
  flex: 1;
  padding: 10px;
  background: none;
  border: none;
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-family: inherit;
}
.wa-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.wa-list {
  flex: 1;
  overflow-y: auto;
}
.wa-contact {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.2s;
  display: flex;
  gap: 10px;
  align-items: center;
}
.wa-contact:hover { background: var(--surface); }
.wa-contact.active { background: rgba(37, 99, 235, 0.08); }
.wa-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.wa-contact-info { flex: 1; min-width: 0; }
.wa-contact-name { font-size: 13px; font-weight: 600; }
.wa-contact-preview { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.wa-badge {
  background: var(--primary);
  color: white;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 700;
}

.wa-chat {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.wa-chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.wa-chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  background:
    radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.03), transparent 50%);
}
.wa-msg {
  margin-bottom: 8px;
  max-width: 70%;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.4;
  word-wrap: break-word;
}
.wa-msg.in {
  background: var(--surface);
  margin-right: auto;
  border-bottom-left-radius: 2px;
}
.wa-msg.out {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 2px;
}
.wa-msg-time {
  font-size: 10px;
  opacity: 0.7;
  margin-top: 4px;
}
.wa-chat-input {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.wa-chat-input input {
  flex: 1;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  color: var(--ink);
  font-family: inherit;
}
.wa-chat-input input:focus {
  outline: none;
  border-color: var(--primary);
}

.wa-status-card {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.wa-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
  animation: pulse 2s ease-in-out infinite;
}
.wa-status-dot.offline { background: var(--ink-3); box-shadow: none; animation: none; }
.wa-qr-box {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  display: grid;
  place-items: center;
  min-height: 240px;
}


@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 16px; }
  .kanban { grid-template-columns: 1fr; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">W</div>
    <span>Work2U CRM</span>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="icon-btn" id="gmail-btn" onclick="connectGmail()" title="Gmail">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <span class="badge" id="gmail-badge" style="display:none;">0</span>
    </button>
    <button class="icon-btn" onclick="switchView('ai')" title="AI Assistant">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z M2 17l10 5 10-5 M2 12l10 5 10-5"/>
      </svg>

  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="workspace-selector" onclick="toggleWorkspaceDropdown(event)">
      <div class="ws-icon" id="ws-icon" style="background: linear-gradient(135deg, #2563eb, #06b6d4);">S</div>
      <div class="ws-info">
        <div class="ws-name" id="ws-name">Saga X</div>
        <div class="ws-plan">Free Plan</div>
      </div>
      <button class="ws-add" onclick="event.stopPropagation(); openWorkspaceModal()" title="Add">+</button>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Main</div>
      <button class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
        Dashboard
      </button>
      <button class="nav-item" data-view="tasks" onclick="switchView('tasks')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
        Tasks
      </button>
      <button class="nav-item" data-view="leads" onclick="switchView('leads')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="18" r="2"/></svg></span>
        Leads
      </button>
      <button class="nav-item" data-view="clients" onclick="switchView('clients')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
        Clients
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Business</div>
      <button class="nav-item" data-view="services" onclick="switchView('services')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
        Services
      </button>
      <button class="nav-item" data-view="cases" onclick="switchView('cases')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
        Cases
      </button>
      <button class="nav-item" data-view="calendar" onclick="switchView('calendar')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4 M8 2v4 M3 10h18"/></svg></span>
        Calendar
      </button>
      <button class="nav-item" data-view="email" onclick="switchView('email')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
        Email
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Finance</div>
      <button class="nav-item" data-view="accounting" onclick="switchView('accounting')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg></span>
        Accounting
      </button>
      <button class="nav-item" data-view="reports" onclick="switchView('reports')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 5-5"/></svg></span>
        Reports
      </button>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Communication</div>
      <button class="nav-item" data-view="whatsapp" onclick="switchView('whatsapp')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        WhatsApp
      </button>
      <button class="nav-item" data-view="ai" onclick="switchView('ai')">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg></span>
        AI Assistant
      </button>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 class="modal-title" id="modal-title">Add</h2>
    <form id="main-form"></form>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
const K = {
  tasks: 'work2u-tasks',
  leads: 'work2u-leads',
  clients: 'work2u-clients',
  services: 'work2u-services',
  cases: 'work2u-cases',
  invoices: 'work2u-invoices',
  expenses: 'work2u-expenses',
  payments: 'work2u-payments',
  receipts: 'work2u-receipts',
  quotes: 'work2u-quotes',
  theme: 'work2u-theme',
  gmail: 'work2u-gmail',
  shares: 'work2u-shares',
  aiHistory: 'work2u-ai-history',
  ws: 'work2u-workspaces',
  wsActive: 'work2u-ws-active'
};

const D = {
  tasks: load(K.tasks),
  leads: load(K.leads),
  clients: load(K.clients),
  services: load(K.services),
  cases: load(K.cases),
  invoices: load(K.invoices),
  expenses: load(K.expenses),
  payments: load(K.payments),
  receipts: load(K.receipts),
  quotes: load(K.quotes)
};

let view = 'dashboard';
let editId = null;
let currentTab = 'all';
let workspaces = load(K.ws) || [];
let activeWsId = localStorage.getItem(K.wsActive);

function load(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } }
function save(key) { localStorage.setItem(key, JSON.stringify(D[key])); }
function wsKey(key) { return 'work2u-' + activeWsId + '-' + key; }

function getWs() {
  if (workspaces.length === 0) {
    const def = { id: 'ws-' + Date.now(), name: 'Saga X', color: '#2563eb' };
    workspaces = [def];
    activeWsId = def.id;
    saveWs();
  }
  if (!activeWsId || !workspaces.find(function(w) { return w.id === activeWsId; })) {
    activeWsId = workspaces[0].id;
    saveWs();
  }
  return workspaces.find(function(w) { return w.id === activeWsId; });
}

function saveWs() {
  localStorage.setItem(K.ws, JSON.stringify(workspaces));
  localStorage.setItem(K.wsActive, activeWsId);
}

function loadWsData() {
  Object.keys(D).forEach(function(key) {
    D[key] = load(wsKey(key));
  });
}

function saveKey(key) {
  localStorage.setItem(wsKey(key), JSON.stringify(D[key]));
}

function updateWsUI() {
  const ws = getWs();
  const icon = document.getElementById('ws-icon');
  const name = document.getElementById('ws-name');
  if (icon) { icon.style.background = 'linear-gradient(135deg, ' + ws.color + ', ' + ws.color + '99)'; icon.textContent = ws.name.charAt(0).toUpperCase(); }
  if (name) name.textContent = ws.name;
}

function toggleTheme() {
  const c = document.documentElement.getAttribute('data-theme');
  const n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem(K.theme, n);
}

function loadTheme() {
  const t = localStorage.getItem(K.theme) || 'light';
  document.documentElement.setAttribute('data-theme', t);
}

function switchView(v) {
  view = v;
  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.classList.toggle('active', item.dataset.view === v);
  });
  currentTab = 'all';
  render();
}

function render() {
  const main = document.getElementById('main');
  if (view === 'dashboard') renderDashboard(main);
  else if (view === 'tasks') renderTasks(main);
  else if (view === 'leads') renderLeads(main);
  else if (view === 'clients') renderClients(main);
  else if (view === 'services') renderServices(main);
  else if (view === 'cases') renderCases(main);
  else if (view === 'calendar') renderCalendar(main);
  else if (view === 'email') renderEmail(main);
  else if (view === 'accounting') renderAccounting(main);
  else if (view === 'reports') renderReports(main);
  else if (view === 'whatsapp') renderWhatsApp(main);
  else if (view === 'ai') renderAI(main);
}

function renderDashboard(c) {
  let revenue = 0, expenses = 0;
  D.payments.forEach(function(p) { revenue += parseFloat(p.amount) || 0; });
  D.expenses.forEach(function(e) { expenses += parseFloat(e.amount) || 0; });
  const profit = revenue - expenses;
  const margin = revenue > 0 ? ((profit / revenue) * 100).toFixed(1) : 0;
  const pending = D.invoices.filter(function(i) { return i.status !== 'paid'; }).length;

  c.innerHTML = '<div class="page-header"><div><h1 class="page-title">Dashboard</h1><div class="page-sub">Welcome back to your business overview</div></div></div>' +
    '<div class="stats">' +
      '<div class="stat-card positive"><div class="stat-card-label">Revenue</div><div class="stat-card-num">RM ' + revenue.toLocaleString() + '</div><div class="stat-card-sub">This period</div></div>' +
      '<div class="stat-card negative"><div class="stat-card-label">Expenses</div><div class="stat-card-num">RM ' + expenses.toLocaleString() + '</div><div class="stat-card-sub">This period</div></div>' +
      '<div class="stat-card ' + (profit >= 0 ? 'positive' : 'negative') + '"><div class="stat-card-label">Profit</div><div class="stat-card-num">RM ' + profit.toLocaleString() + '</div><div class="stat-card-sub">' + margin + '% margin</div></div>' +
      '<div class="stat-card"><div class="stat-card-label">Pending</div><div class="stat-card-num">' + pending + '</div><div class="stat-card-sub">Invoices</div></div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat-card"><div class="stat-card-label">Tasks</div><div class="stat-card-num">' + D.tasks.length + '</div><div class="stat-card-sub">Total</div></div>' +
      '<div class="stat-card"><div class="stat-card-label">Leads</div><div class="stat-card-num">' + D.leads.length + '</div><div class="stat-card-sub">In pipeline</div></div>' +
      '<div class="stat-card"><div class="stat-card-label">Clients</div><div class="stat-card-num">' + D.clients.length + '</div><div class="stat-card-sub">Active</div></div>' +
      '<div class="stat-card"><div class="stat-card-label">Cases</div><div class="stat-card-num">' + D.cases.length + '</div><div class="stat-card-sub">Support</div></div>' +
    '</div>';
}

function renderTasks(c) {
  c.innerHTML = '<div class="page-header"><div><h1 class="page-title">Tasks</h1><div class="page-sub">Track work across stages</div></div><button class="btn btn-primary" onclick="openAdd()">+ New Task</button></div>' +
    '<div class="tabs">' +
      '<button class="tab ' + (currentTab === 'all' ? 'active' : '') + '" onclick="setTab(\'all\')">All <span class="count">' + D.tasks.length + '</span></button>' +
      '<button class="tab ' + (currentTab === 'todo' ? 'active' : '') + '" onclick="setTab(\'todo\')">To Do</button>' +
      '<button class="tab ' + (currentTab === 'progress' ? 'active' : '') + '" onclick="setTab(\'progress\')">In Progress</button>' +
      '<button class="tab ' + (currentTab === 'review' ? 'active' : '') + '" onclick="setTab(\'review\')">Review</button>' +
      '<button class="tab ' + (currentTab === 'done' ? 'active' : '') + '" onclick="setTab(\'done\')">Done</button>' +
    '</div>' +
    '<div class="kanban">' +
      '<div class="kanban-col"><div class="kanban-col-header"><div class="col-title"><span class="col-dot" style="background:#94a3b8"></span>To Do</div><span class="col-count" id="c1">0</span></div><div id="col1"></div></div>' +
      '<div class="kanban-col"><div class="kanban-col-header"><div class="col-title"><span class="col-dot" style="background:#2563eb"></span>In Progress</div><span class="col-count" id="c2">0</span></div><div id="col2"></div></div>' +
      '<div class="kanban-col"><div class="kanban-col-header"><div class="col-title"><span class="col-dot" style="background:#f59e0b"></span>Review</div><span class="col-count" id="c3">0</span></div><div id="col3"></div></div>' +
      '<div class="kanban-col"><div class="kanban-col-header"><div class="col-title"><span class="col-dot" style="background:#10b981"></span>Done</div><span class="col-count" id="c4">0</span></div><div id="col4"></div></div>' +
    '</div>';
  renderKanban();
}

function renderKanban() {
  const groups = { todo: [], progress: [], review: [], done: [] };
  D.tasks.forEach(function(t) { if (groups[t.status]) groups[t.status].push(t); });
  Object.keys(groups).forEach(function(status, i) {
    const col = document.getElementById('col' + (i + 1));
    const cnt = document.getElementById('c' + (i + 1));
    if (!col) return;
    cnt.textContent = groups[status].length;
    col.innerHTML = '';
    if (groups[status].length === 0) {
      col.innerHTML = '<div style="text-align:center;padding:20px;color:var(--ink-3);font-size:11px;">No tasks</div>';
    } else {
      groups[status].forEach(function(t) {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.onclick = function() { editItem('tasks', t.id); };
        card.innerHTML = '<div class="item-card-title">' + esc(t.name) + '</div><div class="item-card-meta">' +
          '<div><span class="item-tag ' + (t.tag || 'ops') + '">' + (t.tag || 'ops') + '</span></div>' +
          '<span class="item-prio ' + (t.priority === 'high' ? 'high' : t.priority === 'low' ? 'low' : 'med') + '">● ' + (t.priority || 'med') + '</span>' +
          '</div>';
        col.appendChild(card);
      });
    }
  });
}

function renderLeads(c) {
  c.innerHTML = '<div class="page-header"><div><h1 class="page-title">Leads</h1><div class="page-sub">Prospects not yet converted</div></div><button class="btn btn-primary" onclick="openAdd()">+ New Lead</button></div>' +
    '<div class="kanban">' +
      '<div class="kanban-col"><div class="kanban-col-header"><div class="col-title"><span class="col-dot" style="background:#2563eb"></span>New</div><span class="col-count" id="c1">0</span></div><div id="col1"></div></div>' +
      '<div class="kanban-col"><div class="kanban-col-header"><div class="col-title"><span class="col-dot" style="background:#06b6d4"></span>Contacted</div><span class="col-count" id="c2">0</span></div><div id="col2"></div></div>' +
      '<div class="kanban-col"><div class="kanban-col-header"><div class="col-title"><span class="col-dot" style="background:#f59e0b"></span>Qualified</div><span class="col-count" id="c3">0</span></div><div id="col3"></div></div>' +
      '<div class="kanban-col"><div class="kanban-col-header"><div class="col-title"><span class="col-dot" style="background:#10b981"></span>Converted</div><span class="col-count" id="c4">0</span></div><div id="col4"></div></div>' +
    '</div>';
  renderPipeline('leads', ['new', 'contacted', 'qualified', 'converted']);
}

function renderPipeline(key, stages) {
  const groups = {};
  stages.forEach(function(s) { groups[s] = []; });
  D[key].forEach(function(item) { if (groups[item.status]) groups[item.status].push(item); });
  stages.forEach(function(status, i) {
    const col = document.getElementById('col' + (i + 1));
    const cnt = document.getElementById('c' + (i + 1));
    if (!col) return;
    cnt.textContent = groups[status].length;
    col.innerHTML = '';
    if (groups[status].length === 0) {
      col.innerHTML = '<div style="text-align:center;padding:20px;color:var(--ink-3);font-size:11px;">No items</div>';
    } else {
      groups[status].forEach(function(item) {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.onclick = function() { editItem(key, item.id); };
        const value = parseFloat(item.value) || 0;
        card.innerHTML = '<div class="item-card-title">' + esc(item.name) + '</div><div class="item-card-meta"><span style="font-size:11px;color:var(--ink-3);">' + esc(item.company || '') + '</span>' + (value > 0 ? '<span style="font-weight:700;color:var(--green);">RM ' + value.toLocaleString() + '</span>' : '') + '</div>';
        col.appendChild(card);
      });
    }
  });
}

function renderClients(c) {
  c.innerHTML = '<div class="page-header"><div><h1 class="page-title">Clients</h1><div class="page-sub">Converted customers</div></div><button class="btn btn-primary" onclick="openAdd()">+ Add Client</button></div>' +
    '<div id="list"></div>';
  const list = document.getElementById('list');
  if (D.clients.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">No clients yet</div><button class="btn btn-primary" onclick="openAdd()">+ Add First Client</button></div>';
  } else {
    D.clients.forEach(function(item) {
      const card = document.createElement('div');
      card.className = 'list-card';
      card.onclick = function() { editItem('clients', item.id); };
      const value = parseFloat(item.totalRevenue) || 0;
      card.innerHTML = '<div class="list-card-row"><div style="flex:1;"><div class="list-card-title">' + esc(item.name) + '</div><div class="list-card-info">' + (item.company ? '<span>🏢 ' + esc(item.company) + '</span>' : '') + (item.email ? '<span>✉️ ' + esc(item.email) + '</span>' : '') + (item.phone ? '<span>📞 ' + esc(item.phone) + '</span>' : '') + '</div></div><div class="list-card-amount">RM ' + value.toLocaleString() + '</div></div>';
      list.appendChild(card);
    });
  }
}

function renderServices(c) {
  c.innerHTML = '<div class="page-header"><div><h1 class="page-title">Services</h1><div class="page-sub">Your service catalog</div></div><button class="btn btn-primary" onclick="openAdd()">+ Add Service</button></div>' +
    '<div id="list"></div>';
  const list = document.getElementById('list');
  if (D.services.length === 0) {

function renderCalendar(c) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let html = '<div class="page-header"><div><h1 class="page-title">Calendar</h1><div class="page-sub">Synced with Google Calendar</div></div></div>';
  html += '<div style="background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:20px;">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;"><div style="font-size:16px;font-weight:700;">' + months[m] + ' ' + y + '</div></div>';
  html += '<div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d) { html += '<div class="cal-day-header">' + d + '</div>'; });
  for (let i = 0; i < first; i++) html += '<div class="cal-day"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const events = [];
    D.tasks.forEach(function(t) { if (t.due === ds) events.push(t.name); });
    D.leads.forEach(function(l) { if (l.followup === ds) events.push('📞 ' + l.name); });
    const isToday = d === now.getDate();
    html += '<div class="cal-day' + (isToday ? ' today' : '') + '"><div class="cal-day-num">' + d + '</div>';
    events.slice(0, 3).forEach(function(e) { html += '<div class="cal-event">' + esc(e) + '</div>'; });
    if (events.length > 3) html += '<div style="font-size:9px;color:var(--ink-3);margin-top:2px;">+' + (events.length - 3) + ' more</div>';
    html += '</div>';
  }
  html += '</div></div>';
  c.innerHTML = html;
}

function saveWASettings() {
  const url = document.getElementById('wa-service-url-input').value.trim().replace(/\/$/, '');

  if (!url || !key) { notify('⚠️ Both fields required'); return; }

function showWASettings() {
  const url = getWAServiceUrl();

  const newUrl = prompt('WhatsApp Service URL:', url);
  if (newUrl === null) return;
  const newKey = prompt('API Key:', key);

  localStorage.setItem('work2u-wa-key', newKey.trim());

async function renderWAConnect() {
  const c = document.getElementById('wa-container');
  if (!c) return;
  
  c.innerHTML = '<div style="background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:32px;display:grid;place-items:center;text-align:center;max-width:480px;margin:0 auto;">' +
    '<div class="wa-qr-box" id="wa-qr-box"><div style="padding:40px;color:var(--ink-3);">⏳ Generating QR...</div></div>' +
    '<div style="margin-top:20px;"><h3 style="font-size:16px;font-weight:700;margin-bottom:8px;">Scan with WhatsApp</h3>' +
    '<p style="color:var(--ink-2);font-size:13px;margin-bottom:8px;">Open WhatsApp on your phone → Settings → Linked Devices → Link a Device</p>' +
    '<p style="color:var(--ink-3);font-size:11px;">Workspace: <strong>' + esc(getWs().name) + '</strong></p>' +
    '</div></div>';
  
  if (waPollInterval) clearInterval(waPollInterval);
  
  const poll = async function() {
    const wsId = getWs().id;
    try {
      const r = await fetch(getWAServiceUrl() + '/api/sessions/' + encodeURIComponent(wsId) + '/qr', {
        headers: { 'Authorization': 'Bearer ' + getWAApiKey() }
      });
      const data = await r.json();
      
      if (data.connected) {
        waConnected = true;
        if (waPollInterval) clearInterval(waPollInterval);
        notify('✅ WhatsApp connected!');
        render();
        return;
      } else if (data.qr) {
        const qrBox = document.getElementById('wa-qr-box');
        if (qrBox && !waConnected) {
          qrBox.innerHTML = '<img src="' + data.qr + '" style="max-width:300px;width:100%;border-radius:8px;" alt="QR">';
        }
      } else if (data.status === 'initializing') {
        const qrBox = document.getElementById('wa-qr-box');
        if (qrBox) qrBox.innerHTML = '<div style="padding:20px;color:var(--ink-3);">⏳ Initializing...</div>';
      } else if (data.status === 'auth_failed' || data.status === 'init_failed') {
        const qrBox = document.getElementById('wa-qr-box');
        if (qrBox) qrBox.innerHTML = '<div style="padding:20px;color:var(--red);">❌ ' + data.status + '</div>';
      }
    } catch (e) {
      console.error('QR poll error:', e);
      const qrBox = document.getElementById('wa-qr-box');
      if (qrBox) qrBox.innerHTML = '<div style="padding:20px;text-align:center;"><div style="color:var(--red);font-weight:600;margin-bottom:8px;">⚠️ Cannot reach WhatsApp service</div><div style="color:var(--ink-3);font-size:11px;">' + esc(getWAServiceUrl()) + '</div></div>';
      if (waPollInterval) clearInterval(waPollInterval);
    }
  };
  
  poll();
  waPollInterval = setInterval(poll, 3000);
}

async function disconnectWA() {
  if (!confirm('Disconnect WhatsApp from this workspace?')) return;
  try {
    await fetch(getWAServiceUrl() + '/api/sessions/' + encodeURIComponent(getWs().id) + '/disconnect', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getWAApiKey() }
    });
  } catch (e) {}
  waConnected = false;
  if (waPollInterval) clearInterval(waPollInterval);
  notify('WhatsApp disconnected');
  render();
}

async function sendWAMsg() {
  const input = document.getElementById('wa-input');
  const text = input.value.trim();
  if (!text || !waActiveChat) return;

  try {
    const r = await fetch(getWAServiceUrl() + '/api/sessions/' + encodeURIComponent(getWs().id) + '/messages/send', {
      method: 'POST',
      headers: { 
        'Authorization': 'Bearer ' + getWAApiKey(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ phone: waActiveChat, message: text })
    });
    
    if (!r.ok) {
      const err = await r.json().catch(function() { return {}; });
      notify('⚠️ ' + (err.error || 'Send failed'));
      return;
    }
  } catch (e) {
    notify('⚠️ Cannot reach WhatsApp service');
    return;
  }

  if (!waMessages[waActiveChat]) waMessages[waActiveChat] = [];
  waMessages[waActiveChat].push({
    from: 'me',
    text: text,
    time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
  });
  localStorage.setItem('work2u-wa-messages', JSON.stringify(waMessages));
  input.value = '';
  renderWAChat();
}

  const phone = prompt('Phone number (with country code, e.g. +60123456789):');

function renderAI(c) {
  const history = load(K.aiHistory);
  let msgsHtml = '';
  if (history.length === 0) {
    msgsHtml = '<div class="ai-msg assistant">Hi! I\'m your AI assistant. I can help with tasks, reports, client management, and more. Ask me anything!</div>';
  } else {
    history.forEach(function(m) {
      msgsHtml += '<div class="ai-msg ' + (m.role === 'user' ? 'user' : 'assistant') + '">' + esc(m.text) + '</div>';
    });
  }
  c.innerHTML = '<div class="page-header"><div><h1 class="page-title">AI Assistant</h1><div class="page-sub">Powered by Gemini, Claude & ChatGPT</div></div></div>' +
    '<div class="ai-chat"><div class="ai-messages" id="ai-msgs">' + msgsHtml + '</div>' +
    '<form class="ai-input-row" onsubmit="event.preventDefault(); askAI();"><input type="text" class="form-input" id="ai-input" placeholder="Ask me anything..."><button type="submit" class="btn btn-primary">Send</button></form></div>';
  const el = document.getElementById('ai-msgs');
  if (el) el.scrollTop = el.scrollHeight;
}

function askAI() {
  const input = document.getElementById('ai-input');
  const q = input.value.trim();
  if (!q) return;
  const history = load(K.aiHistory);
  history.push({ role: 'user', text: q, at: Date.now() });
  localStorage.setItem(K.aiHistory, JSON.stringify(history));
  input.value = '';
  renderAI(document.getElementById('main'));
  fetch('/api/ai/groq', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: q })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      const h = load(K.aiHistory);
      h.push({ role: 'assistant', text: data.text || data.error || 'Sorry, I couldn\'t process that.', at: Date.now() });
      localStorage.setItem(K.aiHistory, JSON.stringify(h));
      renderAI(document.getElementById('main'));
    })
    .catch(function() {
      const h = load(K.aiHistory);
      h.push({ role: 'assistant', text: '⚠️ AI service unavailable. Please try again later.', at: Date.now() });
      localStorage.setItem(K.aiHistory, JSON.stringify(h));
      renderAI(document.getElementById('main'));
    });
}

function handleSave() {
  const type = view;
  let item;
  if (type === 'tasks') item = { name: getV('f-name'), priority: getV('f-priority'), status: getV('f-status'), due: getV('f-due'), tag: getV('f-tag'), notes: getV('f-notes') };
  else if (type === 'leads') item = { name: getV('f-name'), company: getV('f-company'), value: parseFloat(getV('f-value')) || 0, email: getV('f-email'), phone: getV('f-phone'), status: getV('f-status'), followup: getV('f-followup'), notes: getV('f-notes') };
  else if (type === 'clients') item = { name: getV('f-name'), company: getV('f-company'), status: getV('f-status'), email: getV('f-email'), phone: getV('f-phone'), totalRevenue: parseFloat(getV('f-totalRevenue')) || 0, serviceId: getV('f-serviceId'), notes: getV('f-notes') };
  else if (type === 'services') item = { name: getV('f-name'), category: getV('f-category'), price: parseFloat(getV('f-price')) || 0, description: getV('f-description') };
  else if (type === 'cases') item = { title: getV('f-title'), clientId: getV('f-clientId'), priority: getV('f-priority'), status: getV('f-status'), assignedTo: getV('f-assignedTo'), description: getV('f-description') };
  
  if (editId) {
    const i = D[type].findIndex(function(x) { return x.id === editId; });
    if (i !== -1) D[type][i] = Object.assign({}, D[type][i], item);
    notify('✅ Updated');
  } else {
    item.id = Date.now().toString();
    item.createdAt = new Date().toISOString();
    D[type].push(item);
    notify('✅ Added');
  }
  saveKey(type);
  editId = null;
  closeModal();
  render();
}

function editItem(type, id) {
  editId = id;
  const item = D[type].find(function(x) { return x.id === id; });
  if (!item) return;
  const form = document.getElementById('main-form');
  const title = document.getElementById('modal-title');
  form.onsubmit = function(e) { e.preventDefault(); handleSave(); };
  const oldView = view;
  view = type;
  if (type === 'tasks') { title.textContent = 'Edit Task'; form.innerHTML = fieldsTasks(item); }
  else if (type === 'leads') { title.textContent = 'Edit Lead'; form.innerHTML = fieldsLeads(item); }
  else if (type === 'clients') { title.textContent = 'Edit Client'; form.innerHTML = fieldsClients(item); }
  else if (type === 'services') { title.textContent = 'Edit Service'; form.innerHTML = fieldsServices(item); }
  else if (type === 'cases') { title.textContent = 'Edit Case'; form.innerHTML = fieldsCases(item); }
  view = oldView;
  document.getElementById('modal').classList.add('active');
}

  if (!editId || !confirm('Delete this item?')) return;
  const type = view;
  D[type] = D[type].filter(function(x) { return x.id !== editId; });
  saveKey(type);
  editId = null;

  notify('🗑️ Deleted');
}

function savePayment() {
  const item = { description: getV('f-description'), amount: parseFloat(getV('f-amount')) || 0, date: getV('f-date') };
  item.id = Date.now().toString();
  D.payments.push(item);
  saveKey('payments');
  editId = null; closeModal(); render(); notify('✅ Payment recorded');
}

function composeEmail() {
  editingId = null;
  const form = document.getElementById('main-form');
  form.onsubmit = function(e) { e.preventDefault(); sendEmail(); };
  document.getElementById('modal-title').textContent = 'Compose Email';
  form.innerHTML = '<div class="form-group"><label class="form-label">To</label><input type="email" class="form-input" id="em-to" required></div><div class="form-group"><label class="form-label">Subject</label><input type="text" class="form-input" id="em-subject" required></div><div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" id="em-body" style="min-height:200px;" required></textarea></div><div class="btn-row"><div></div><div><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Send</button></div></div>';
  document.getElementById('modal').classList.add('active');
}

function sendEmail() {
  notify('✅ Email sent (mock)');
  closeModal();
}

function viewEmail(id) {
  const form = document.getElementById('main-form');
  document.getElementById('modal-title').textContent = 'Email #' + id;
  form.innerHTML = '<div style="padding:20px;background:var(--surface);border-radius:8px;margin-bottom:16px;"><div style="font-size:12px;color:var(--ink-3);margin-bottom:4px;">From: client@example.com</div><div style="font-size:18px;font-weight:700;">Subject</div></div><div style="font-size:13px;line-height:1.6;">Email body content here...</div><div class="btn-row"><button type="button" class="btn btn-ghost" onclick="closeModal();composeEmail();">↩️ Reply</button><div><button type="button" class="btn btn-ghost" onclick="closeModal()">Close</button></div></div>';
  form.onsubmit = function(e) { e.preventDefault(); };
  document.getElementById('modal').classList.add('active');
}

function syncEmails() { notify('🔄 Syncing...'); setTimeout(function() { notify('✅ Synced'); }, 1000); }

function connectGmail() {
  if (localStorage.getItem(K.gmail)) {
    if (confirm('Disconnect Gmail?')) {
      localStorage.removeItem(K.gmail);
      document.getElementById('gmail-badge').style.display = 'none';
      notify('✓ Disconnected');
      render();
    }
  } else {
    localStorage.setItem(K.gmail, 'demo-token');
    document.getElementById('gmail-badge').style.display = 'inline-block';
    document.getElementById('gmail-badge').textContent = '3';
    notify('✅ Gmail connected (demo)');
    render();
  }
}

function exportCSV() {
  let csv = 'Type,Name,Amount,Date,Status\n';
  D.invoices.forEach(function(i) { csv += 'Invoice,' + esc(i.number) + ',' + (i.amount || 0) + ',' + (i.due || '') + ',' + (i.status || '') + '\n'; });
  D.expenses.forEach(function(e) { csv += 'Expense,' + esc(e.description) + ',' + (e.amount || 0) + ',' + (e.date || '') + ',' + (e.category || '') + '\n'; });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'work2u-report-' + Date.now() + '.csv';
  a.click();
  notify('📥 CSV downloaded');
}

function openWorkspaceModal() {
  editingId = null;
  const form = document.getElementById('main-form');
  form.onsubmit = function(e) { e.preventDefault(); saveWorkspace(); };
  document.getElementById('modal-title').textContent = 'New Workspace';
  form.innerHTML = '<div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" id="ws-name" required></div><div class="form-group"><label class="form-label">Color</label><select class="form-select" id="ws-color"><option value="#2563eb">Blue</option><option value="#06b6d4">Cyan</option><option value="#8b5cf6">Purple</option><option value="#ec4899">Pink</option><option value="#10b981">Green</option><option value="#f59e0b">Orange</option></select></div><div class="btn-row"><div></div><div><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Create</button></div></div>';
  document.getElementById('modal').classList.add('active');
}

function saveWorkspace() {
  const name = getV('ws-name');
  const color = getV('ws-color');
  if (!name) return;
  workspaces.push({ id: 'ws-' + Date.now(), name: name, color: color });
  activeWsId = workspaces[workspaces.length - 1].id;
  saveWs();
  loadWsData();
  updateWsUI();
  closeModal();
  render();
  notify('✅ Workspace: ' + name);
}

function toggleWorkspaceDropdown(e) {
  e.stopPropagation();
  if (workspaces.length === 1) {
    openWorkspaceModal();
    return;
  }
  const choice = prompt('Switch to:\n' + workspaces.map(function(w, i) { return (i + 1) + '. ' + w.name; }).join('\n') + '\n\nEnter number:');
  const idx = parseInt(choice) - 1;
  if (workspaces[idx]) {
    activeWsId = workspaces[idx].id;
    saveWs();
    loadWsData();
    updateWsUI();
    render();
    notify('✓ ' + workspaces[idx].name);
  }
}

function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
function getV(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function notify(msg) { const el = document.getElementById('notif'); el.textContent = msg; el.classList.add('show'); setTimeout(function() { el.classList.remove('show'); }, 2500); }

document.querySelectorAll('.modal-overlay').forEach(function(o) {
  o.addEventListener('click', function(e) { if (e.target === o) closeModal(); });
});

window.addEventListener('DOMContentLoaded', function() {
  loadTheme();
  getWs();
  loadWsData();
  updateWsUI();
  if (localStorage.getItem(K.gmail)) {
    const b = document.getElementById('gmail-badge');
    if (b) { b.style.display = 'inline-block'; b.textContent = '3'; }
  }
  render();
});
</script>

</body>
